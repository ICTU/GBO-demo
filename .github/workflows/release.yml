name: release

# Third-party actions are pinned to immutable commit SHAs. Update the SHA and
# version comment together; never rely on a mutable tag.

# A release publishes the bits that build.yml already built and tested on
# main. Both call images.yml, which tags every image by its build inputs;
# an image whose inputs did not change is retagged with the release
# version rather than rebuilt. Only the chart is genuinely produced here.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate release tag
        id: version
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be SemVer with a v prefix (for example v0.1.0)." >&2
            exit 1
          fi
          printf 'version=%s\n' "${GITHUB_REF_NAME#v}" >>"${GITHUB_OUTPUT}"

  images:
    name: Images
    needs: validate
    uses: ./.github/workflows/images.yml
    permissions:
      contents: read
      packages: write
    with:
      release_version: ${{ needs.validate.outputs.version }}

  chart:
    name: Helm chart
    needs: [validate, images]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.17.3

      - name: Log in to GHCR
        shell: bash
        run: |
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Package and push chart
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          helm dependency build deploy/helm/gbo-app
          helm package deploy/helm/gbo-app \
            --version "${VERSION}" \
            --app-version "${VERSION}"
          helm push "gbo-app-${VERSION}.tgz" \
            oci://ghcr.io/ictu/gbo-demo-charts
