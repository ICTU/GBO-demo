name: ci

# Third-party actions and container images are pinned to immutable
# commit SHAs / digests. Update the SHA + the version comment together
# when bumping; never rely on a mutable tag.

on:
  pull_request:
  push:
    branches: [main]

env:
  # openpolicyagent/opa:1.9.0-static
  OPA_IMAGE: openpolicyagent/opa:1.9.0-static@sha256:60b6af32b58377718546ac7d4634eecbfe50ec36f7d3ca3f8ebf515f9826c2ac

jobs:
  go:
    name: Go — lint + test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - additional-claims-service
          - bron-sidecar
          - bsnk-mock
          - consent-portal-backend
          - consent-register
          - dev-portal-backend
          - dienstverlener-backend
          - eudi-adapter
          - graphql-server
          - sector-pip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: '1.25'
          cache-dependency-path: services/${{ matrix.service }}/go.*
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --config ../../.golangci.yml --timeout 3m
          working-directory: services/${{ matrix.service }}
      - name: go test
        working-directory: services/${{ matrix.service }}
        run: go test -timeout 60s ./...

  # The OpenFTV request-mapper is patched into an upstream tree at image
  # build time, so it is not a service and cannot join the matrix above:
  # open-ftv requires Go 1.26.5 where the services are on 1.25. Without
  # this job the only thing checking 500 lines of security-critical
  # request parsing would be `docker build`.
  mapper:
    name: Go — lint + test (openftv-pdp mapper)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: '1.26.5'
          cache-dependency-path: services/openftv-pdp/go.*
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --config ../../.golangci.yml --timeout 3m
          working-directory: services/openftv-pdp
      - name: go test
        working-directory: services/openftv-pdp
        run: go test -timeout 60s ./...
      # The module and the image must compile against the same OpenFTV
      # commit, or the tests verify a different mapper than the one that
      # ships.
      # The mapper module, the PDP image and the Manager image must all
      # come from one OpenFTV tree: the bundle format travels between the
      # PDP and the Manager, and the tests must compile against the same
      # eam/models the image builds against.
      - name: open-ftv pin is identical across go.mod, PDP and Manager
        run: |
          ref="$(grep -oP 'OPENFTV_REF=\K[0-9a-f]+' services/openftv-pdp/Dockerfile)"
          mgr="$(grep -oP 'OPENFTV_REF=\K[0-9a-f]+' services/openftv-manager/Dockerfile)"
          if [ "$ref" != "$mgr" ]; then
            echo "OPENFTV_REF differs: pdp=$ref manager=$mgr" >&2
            exit 1
          fi
          if ! grep -q "open-ftv v.*${ref:0:12}" services/openftv-pdp/go.mod; then
            echo "go.mod does not pin open-ftv to OPENFTV_REF ($ref)" >&2
            grep open-ftv services/openftv-pdp/go.mod >&2
            exit 1
          fi

  rego:
    name: Rego — fmt + check + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: opa fmt --diff
        run: |
          docker run --rm -v $(pwd)/policies:/w -w /w \
            $OPA_IMAGE fmt --diff /w
      - name: opa check
        run: |
          docker run --rm -v $(pwd)/policies:/w -w /w \
            $OPA_IMAGE check /w
      - name: opa test
        run: |
          docker run --rm -v $(pwd)/policies:/w -w /w \
            $OPA_IMAGE test /w -v
      - name: rules.json is up to date
        run: |
          ./scripts/gen-rules-json.sh
          git diff --exit-code -- services/dev-portal-backend/rules.json

  chart:
    name: Helm chart — lint + template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.17.3
      - name: helm lint
        run: helm lint deploy/helm/gbo-app
      - name: helm template — default values
        run: helm template gbo-app deploy/helm/gbo-app
      - name: helm template — OpenFTV PDP
        run: >-
          helm template openftv-pdp deploy/helm/gbo-app
          --values deploy/helm/gbo-app/examples/openftv-pdp-values.yaml

  frontend:
    name: Frontend — tsc --strict
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - developer-portal
          - dienstverlener-mock
          - toestemmingsportaal-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: npm ci
        working-directory: ${{ matrix.app }}
        run: npm ci
      - name: tsc --noEmit
        working-directory: ${{ matrix.app }}
        run: npx tsc --noEmit

  docker:
    name: Docker — build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - additional-claims-service
          - dev-portal-backend
          - eudi-adapter
          - graphql-server
          - sector-pip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: |
          docker build \
            --file "services/${{ matrix.service }}/Dockerfile" \
            --tag "gbo-demo/${{ matrix.service }}:ci" \
            "services/${{ matrix.service }}"

  # openftv-pdp builds from the repo root: its Dockerfile bakes in
  # ./policies (which now also carries the GraphQL SDLs the mapper reads),
  # so it cannot join the matrix above. Built at PR time because a policy
  # change can break the image, and because it is the only thing that
  # proves the Dockerfile's patch of the upstream tree still applies —
  # release builds are not gated on a PR, so a broken patch would
  # otherwise reach a published image.
  docker-openftv-pdp:
    name: Docker — build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - openftv-pdp
          - openftv-manager
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: |
          docker build \
            --file "services/${{ matrix.service }}/Dockerfile" \
            --tag "gbo-demo/${{ matrix.service }}:ci" \
            .


  # Aggregate gate: the repo ruleset requires a single "CI result" status.
  result:
    name: CI result
    runs-on: ubuntu-latest
    needs: [go, mapper, rego, chart, frontend, docker, docker-openftv-pdp]
    if: always()
    steps:
      - name: Evaluate job results
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$results" | jq -e 'any(.result != "success")' > /dev/null; then
            echo "One or more CI jobs failed" >&2
            exit 1
          fi
