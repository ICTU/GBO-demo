name: ci

# Third-party actions and container images are pinned to immutable
# commit SHAs / digests. Update the SHA + the version comment together
# when bumping; never rely on a mutable tag.

on:
  pull_request:
  push:
    branches: [main]

env:
  # openpolicyagent/opa:1.9.0-static
  OPA_IMAGE: openpolicyagent/opa:1.9.0-static@sha256:60b6af32b58377718546ac7d4634eecbfe50ec36f7d3ca3f8ebf515f9826c2ac

jobs:
  go:
    name: Go — lint + test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - additional-claims-service
          - bron-sidecar
          - brp-graphql-server
          - bsnk-mock
          - consent-portal-backend
          - consent-register
          - dev-portal-backend
          - dienstverlener-backend
          - dvtp-onboarding-register
          - eudi-adapter
          - graphql-server
          - sector-pip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache-dependency-path: services/${{ matrix.service }}/go.*
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --config ../../.golangci.yml --timeout 3m
          working-directory: services/${{ matrix.service }}
      - name: go test
        working-directory: services/${{ matrix.service }}
        run: go test -timeout 60s ./...

  source-registry:
    name: Source Registry — PostgreSQL migrations + atomicity
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:a5074487380d4e686036ce61ed6f2d363939ae9a0c40123d1a9e3bb3a5f344b4
        env:
          POSTGRES_PASSWORD: registrytest
          POSTGRES_DB: registrytest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d registrytest"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache-dependency-path: services/eudi-adapter/go.*
      - name: migration, persistence, promotion and rollback tests
        working-directory: services/eudi-adapter
        env:
          SOURCE_REGISTRY_TEST_PASSWORD: registrytest
        run: >-
          SOURCE_REGISTRY_TEST_DATABASE_URL="postgres://postgres:${SOURCE_REGISTRY_TEST_PASSWORD}@127.0.0.1:5432/registrytest?sslmode=disable"
          go test -count=1 -timeout 60s ./internal/postgresregistry

  rego:
    name: Rego — fmt + check + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The OpenFTV PAP loads EVERY file under PDP_POLICIES_STORE as a Rego
      # module (eam/pap/loader.go). A file that does not parse makes OPA keep
      # its previous compiler, so every policy later in walk order silently
      # disappears — the PDP then answers "decision was undefined" (HTTP 500)
      # for those paths while the earlier ones keep working. Keep policies/
      # free of anything that is not Rego.
      - name: policies/ contains only Rego
        run: |
          stray=$(find policies -type f ! -name '*.rego' -print)
          if [ -n "$stray" ]; then
            echo "non-Rego files under policies/ (move them elsewhere):" >&2
            echo "$stray" >&2
            exit 1
          fi
      - name: opa fmt --diff
        run: |
          docker run --rm -v $(pwd)/policies:/w -w /w \
            $OPA_IMAGE fmt --diff /w
      - name: opa check
        run: |
          docker run --rm -v $(pwd)/policies:/w -w /w \
            $OPA_IMAGE check /w
      - name: opa test
        run: |
          docker run --rm -v $(pwd)/policies:/w -w /w \
            $OPA_IMAGE test /w -v
      - name: rules.json is up to date
        run: |
          ./scripts/gen-rules-json.sh
          git diff --exit-code -- services/dev-portal-backend/rules.json
      - name: field-map.json is up to date
        run: |
          ./scripts/gen-field-map.sh
          git diff --exit-code -- services/openftv-pdp/field-map.json

  chart:
    name: Helm chart — lint + template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.17.3
      - name: helm lint
        run: helm lint deploy/helm/gbo-app
      - name: helm template — default values
        run: helm template gbo-app deploy/helm/gbo-app
      - name: helm template — OpenFTV PDP
        run: >-
          helm template openftv-pdp deploy/helm/gbo-app
          --values deploy/helm/gbo-app/examples/openftv-pdp-values.yaml
      - name: helm template — DvTP onboarding register
        run: >-
          helm template dvtp-onboarding-register deploy/helm/gbo-app
          --values deploy/helm/gbo-app/examples/dvtp-onboarding-register-values.yaml
      - name: helm template — EUDI issuance init container
        run: |
          helm template eudi-issuance-server deploy/helm/gbo-app \
            --values deploy/helm/gbo-app/examples/eudi-issuance-server-values.yaml \
            > /tmp/eudi-issuance-server.yaml
          grep -q '^      initContainers:' /tmp/eudi-issuance-server.yaml
          grep -q 'name: materialize-source-release' /tmp/eudi-issuance-server.yaml
          grep -q 'emptyDir: {}' /tmp/eudi-issuance-server.yaml
          grep -q 'path: development-ca/issuer-ca-cert.pem' /tmp/eudi-issuance-server.yaml
          grep -q 'path: belastingdienst/issuer-key.der.b64' /tmp/eudi-issuance-server.yaml
          grep -q 'path: rvig/status-cert.der.b64' /tmp/eudi-issuance-server.yaml
          grep -q 'runAsUser: 1000' /tmp/eudi-issuance-server.yaml
          grep -q 'fsGroup: 1000' /tmp/eudi-issuance-server.yaml
          if grep -q 'gbo-source-onboarding-state' /tmp/eudi-issuance-server.yaml; then
            echo 'shared onboarding PVC remains in the rendered issuance workload' >&2
            exit 1
          fi

  frontend:
    name: Frontend — tsc --strict
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - developer-portal
          - landing-page
          - dienstverlener-mock
          - toestemmingsportaal-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: npm ci
        working-directory: ${{ matrix.app }}
        run: npm ci
      - name: tsc --noEmit
        working-directory: ${{ matrix.app }}
        run: npx tsc --noEmit
      - name: Unit tests
        working-directory: ${{ matrix.app }}
        run: npm test --if-present

  docker:
    name: Docker — build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - additional-claims-service
          - dev-portal-backend
          - dvtp-onboarding-register
          - eudi-adapter
          - graphql-server
          - openftv-manager
          - openftv-manager-ui
          - openftv-pdp
          - sector-pip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: |
          context="services/${{ matrix.service }}"
          # These reach outside their own service directory: dev-portal-backend
          # and openftv-pdp bake in ./policies, while both Manager images
          # are built from the upstream OpenFTV tree. Same context compose uses.
          case "${{ matrix.service }}" in
            dev-portal-backend|eudi-adapter|openftv-pdp|openftv-manager|openftv-manager-ui) context=. ;;
          esac
          docker build \
            --file "services/${{ matrix.service }}/Dockerfile" \
            --tag "gbo-demo/${{ matrix.service }}:ci" \
            "${context}"
      - name: OPENFTV_REF identical in all OpenFTV Dockerfiles
        if: matrix.service == 'openftv-pdp'
        run: |
          pdp="$(grep -oP 'OPENFTV_REF=\K[0-9a-f]+' services/openftv-pdp/Dockerfile)"
          mgr="$(grep -oP 'OPENFTV_REF=\K[0-9a-f]+' services/openftv-manager/Dockerfile)"
          ui="$(grep -oP 'OPENFTV_REF=\K[0-9a-f]+' services/openftv-manager-ui/Dockerfile)"
          if [ "$pdp" != "$mgr" ] || [ "$pdp" != "$ui" ]; then
            echo "OPENFTV_REF differs: pdp=$pdp manager=$mgr ui=$ui" >&2
            exit 1
          fi
      - name: Test Manager seed authentication
        if: matrix.service == 'openftv-manager'
        run: python3 -m unittest scripts/test_seed_openftv_manager.py
      - name: Verify packaged policy sources
        if: matrix.service == 'dev-portal-backend'
        run: |
          docker run --rm --entrypoint sh \
            "gbo-demo/${{ matrix.service }}:ci" \
            -c 'test -f /rules.json && test -f /policies/authz.rego'

  # Aggregate gate: the repo ruleset requires a single "CI result" status.
  result:
    name: CI result
    runs-on: ubuntu-latest
    needs: [go, source-registry, rego, chart, frontend, docker]
    if: always()
    steps:
      - name: Evaluate job results
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$results" | jq -e 'any(.result != "success")' > /dev/null; then
            echo "One or more CI jobs failed" >&2
            exit 1
          fi
