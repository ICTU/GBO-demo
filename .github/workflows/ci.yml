name: ci

# Third-party actions and container images are pinned to immutable
# commit SHAs / digests. Update the SHA + the version comment together
# when bumping; never rely on a mutable tag.

on:
  pull_request:
  push:
    branches: [main]

env:
  # openpolicyagent/opa:1.9.0-static
  OPA_IMAGE: openpolicyagent/opa:1.9.0-static@sha256:60b6af32b58377718546ac7d4634eecbfe50ec36f7d3ca3f8ebf515f9826c2ac

jobs:
  go:
    name: Go — lint + test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - additional-claims-service
          - bron-sidecar
          - bsnk-mock
          - consent-portal-backend
          - consent-register
          - dev-portal-backend
          - dienstverlener-backend
          - eudi-adapter
          - graphql-server
          - sector-pip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: '1.25'
          cache-dependency-path: services/${{ matrix.service }}/go.*
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --config ../../.golangci.yml --timeout 3m
          working-directory: services/${{ matrix.service }}
      - name: go test
        working-directory: services/${{ matrix.service }}
        run: go test -timeout 60s ./...

  rego:
    name: Rego — fmt + check + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: opa fmt --diff
        run: |
          docker run --rm -v $(pwd)/policies:/w -w /w \
            $OPA_IMAGE fmt --diff /w
      - name: opa check
        run: |
          docker run --rm -v $(pwd)/policies:/w -w /w \
            $OPA_IMAGE check /w
      - name: opa test
        run: |
          docker run --rm -v $(pwd)/policies:/w -w /w \
            $OPA_IMAGE test /w -v
      - name: rules.json is up to date
        run: |
          ./scripts/gen-rules-json.sh
          git diff --exit-code -- services/dev-portal-backend/rules.json
      - name: field-map.json is up to date
        run: |
          ./scripts/gen-field-map.sh
          git diff --exit-code -- services/openftv-pdp/field-map.json

  chart:
    name: Helm chart — lint + template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.17.3
      - name: helm lint
        run: helm lint deploy/helm/gbo-app
      - name: helm template — default values
        run: helm template gbo-app deploy/helm/gbo-app
      - name: helm template — OpenFTV PDP
        run: >-
          helm template openftv-pdp deploy/helm/gbo-app
          --values deploy/helm/gbo-app/examples/openftv-pdp-values.yaml

  frontend:
    name: Frontend — tsc --strict
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - developer-portal
          - dienstverlener-mock
          - toestemmingsportaal-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: npm ci
        working-directory: ${{ matrix.app }}
        run: npm ci
      - name: tsc --noEmit
        working-directory: ${{ matrix.app }}
        run: npx tsc --noEmit

  docker:
    name: Docker — build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - additional-claims-service
          - dev-portal-backend
          - eudi-adapter
          - graphql-server
          - sector-pip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: |
          context="services/${{ matrix.service }}"
          if [[ "${{ matrix.service }}" == "dev-portal-backend" ]]; then
            context=.
          fi
          docker build \
            --file "services/${{ matrix.service }}/Dockerfile" \
            --tag "gbo-demo/${{ matrix.service }}:ci" \
            "${context}"
      - name: Verify packaged policy sources
        if: matrix.service == 'dev-portal-backend'
        run: |
          docker run --rm --entrypoint sh \
            "gbo-demo/${{ matrix.service }}:ci" \
            -c 'test -f /rules.json && test -f /policies/authz.rego'

  # Aggregate gate: the repo ruleset requires a single "CI result" status.
  result:
    name: CI result
    runs-on: ubuntu-latest
    needs: [go, rego, chart, frontend, docker]
    if: always()
    steps:
      - name: Evaluate job results
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$results" | jq -e 'any(.result != "success")' > /dev/null; then
            echo "One or more CI jobs failed" >&2
            exit 1
          fi
