version: 2

# Docker base images are the reason this file exists. The release
# workflow reuses the previous manifest for services whose directory did
# not change, so an image that is never rebuilt keeps the base layers it
# was built with. Dependabot turns a base image update into an ordinary
# change under services/<name>, which the release planner then sees.
#
# GitHub's default security updates only cover gomod here, so the Go
# ecosystem is deliberately left to that and not repeated below.
#
# The two Rust images are omitted on purpose. Both build from the
# nl-wallet submodule rather than their own directory, so a bump to
# either cannot be verified the way the others can.

updates:
  - package-ecosystem: docker
    directories:
      - /developer-portal
      - /dienstverlener-mock
      - /landing-page
      - /toestemmingsportaal-frontend
      - /services/bron-sidecar
      - /services/bsnk-mock
      - /services/consent-portal-backend
      - /services/consent-register
      - /services/dev-portal-backend
      - /services/dienstverlener-backend
      - /services/eudi-adapter
      - /services/graphql-server
      - /services/pdp-service
      - /services/sector-pip
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    # init, autobuild and analyze are three sub-actions of one repository
    # and must run at the same version. Ungrouped, Dependabot opens a PR
    # per sub-action and each one fails on its own with "Loaded a
    # configuration file for version X, but running version Y".
    groups:
      codeql-action:
        patterns:
          - github/codeql-action*

  - package-ecosystem: npm
    directories:
      - /developer-portal
      - /dienstverlener-mock
      - /landing-page
      - /toestemmingsportaal-frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(deps)
    open-pull-requests-limit: 10
    ignore:
      # monaco-graphql is the consumer of monaco-editor in
      # developer-portal and its peer range is ">= 0.20.0 < 0.53". The
      # latest release, 1.8.0, still carries that cap, so anything from
      # 0.53 up cannot install. Drop this once monaco-graphql 2.0 is out.
      - dependency-name: monaco-editor
        versions:
          - ">= 0.53.0"
