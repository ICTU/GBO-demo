      - "services/eudi-credential-issuer/internal/httpapi:TestToken/W2 unknown wallet provider"
    profiles:
      nl:
        status: deviation
        tests:
          - "services/eudi-credential-issuer/internal/httpapi:TestOffers/O3 tx_code refused for nl"
          - "services/eudi-credential-issuer/internal/httpapi:TestToken/T2 expired code"
          - "services/eudi-credential-issuer/internal/httpapi:TestToken/W2 unknown wallet provider"
        reason: "No transaction code: the NL Wallet (v0.6.0) refuses an offer with one. Offers live 5 minutes, are used once and are redeemed only by a wallet of a trusted provider with DPoP; a leaked offer can still be redeemed by another trusted wallet."
      wallet:
        status: deviation
        tests:
          - "services/eudi-credential-issuer/internal/httpapi:TestAnOfferWithATransactionCode"
          - "services/eudi-credential-issuer/internal/httpapi:TestCombinedToken"
        reason: "No transaction code: the combined profile serves the NL Wallet (v0.6.0), which refuses an offer with one. Offers live 5 minutes, are used once and are redeemed only by a wallet of a trusted provider with DPoP; a leaked offer can still be redeemed by another trusted wallet."
