# The conformance claim of the own credential issuer (services/eudi-credential-issuer, #614) against
# OpenID for Verifiable Credential Issuance 1.0: a status per normative statement (see README.md).
# The issuer is Credential Issuer and its own Authorization Server. The default status is the eudi
# profile's; nl (NL Wallet v0.6.0) and wallet (both wallets on one identifier, QTSP route) differ
# where they say so. Requirements on wallets, ecosystems and other parties are outside the claim.
spec: OpenID for Verifiable Credential Issuance 1.0
ids: oid4vci-1.0-ids.txt
profiles: [nl, eudi, wallet]

groups:
  - role: wallet
    status: not-applicable
    reason: A requirement on the wallet.
  - role: ecosystem
    status: not-applicable
    reason: A requirement on the ecosystem or trust framework, not on an implementation.
  - role: other
    status: not-applicable
    reason: A requirement on another party, such as a wallet provider or key attestation issuer.

requirements:
  OID4VCI-3.3.2-01:
    status: passed
    tests:
      - "services/eudi-credential-issuer/internal/httpapi:TestIssueNL"
      - "services/eudi-credential-issuer/internal/httpapi:TestIssueEUDI"
