# The conformance claim of the ASI route against ETSI TS 119 478 V1.1.1:
# a status per requirement ID (see README.md). The requirements are read as
# Implementing Regulation (EU) 2026/1735 Annex IV adapts them: that is the
# text the regulation designates.
spec: ETSI TS 119 478 V1.1.1 (2026-01)
ids: etsi-ts-119478-ids.txt

groups:
  - prefix: REQ-ASIP-6.2.
    status: not-applicable
    reason: The ASIP chooses the HTTP / OAuth interface of clause 6.1 (REQ-ASIP-4.3-04 allows either); clause 6.2 is the ISO 15000 interface, which it does not offer.
  - prefix: REQ-DIP-
    status: not-applicable
    reason: Requirements on the Discover Interface Provider, a role outside the ASIP; the demo plays it with services/asi-discovery-stub.
  - prefix: REQ-TSP-
    status: not-applicable
    reason: Requirements on the trust service provider that asks, a role outside the ASIP; the demo plays it with services/qtsp-reference.

