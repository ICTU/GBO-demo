        reason: "This issuer offers the NL Wallet (v0.6.0) the pre-authorized code flow only; whether the NL Wallet completes the authorization code flow at an external issuer is not tested. The authorization code flow is offered on the eudi profile. At the token endpoint client authentication and DPoP are required."
      wallet:
        status: deviation
        tests:
          - "services/eudi-credential-issuer/internal/httpapi:TestCombinedToken"
        reason: "The combined profile carries pre-authorized offers that both wallets can read (QTSP route); this issuer offers the NL Wallet (v0.6.0) the pre-authorized code flow only, so EUDI wallets use the eudi profile for the authorization code flow. At the token endpoint client authentication and DPoP are required."
