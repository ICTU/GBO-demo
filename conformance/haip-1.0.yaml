# The conformance claim of the own credential issuer (services/eudi-credential-issuer, #614) against
# OpenID4VC High Assurance Interoperability Profile 1.0: a status per normative statement (see README.md).
# The issuer is Credential Issuer, its own Authorization Server, and Verifier for disclosure-based issuance.
# The default status is the eudi profile's; nl (NL Wallet v0.6.0) and wallet (both wallets on one identifier,
# QTSP route) differ where they say so. Requirements on wallets and on ecosystems are outside the claim.
spec: OpenID4VC High Assurance Interoperability Profile 1.0
ids: haip-1.0-ids.txt
profiles: [nl, eudi, wallet]

groups:
  - role: wallet
    status: not-applicable
    reason: "Requirements on the Wallet, a role outside the issuer; the demo uses the NL Wallet and the EUDI reference wallets."
  - role: ecosystem
    status: not-applicable
    reason: "Requirements on ecosystems and trust frameworks, not on an implementation."

requirements:
  HAIP-3-01:
    status: not-applicable
    reason: "An aggregate: every requirement of the flows the issuer implements has its own entry in this matrix, which is the evidence."
  HAIP-3-02:
    status: passed
    tests:
      - "services/eudi-credential-issuer/internal/httpapi:TestIssueNL"
      - "services/eudi-credential-issuer/internal/httpapi:TestIssueEUDI"
      - "services/oid4vc-kit/oid4vp:TestValidResponse"
  HAIP-4-01:
    status: passed
    tests:
      - "services/eudi-credential-issuer/internal/httpapi:TestTheCodeBuysATokenAndACredential"
      - "services/eudi-credential-issuer/internal/httpapi:TestAuthorizationCodeMetadata"
      - "services/eudi-credential-issuer/internal/httpapi:TestWalletInitiatedRequests"
    profiles:
      nl:
        status: deviation
        tests:
          - "services/eudi-credential-issuer/internal/httpapi:TestAuthorizationCodeMetadata"
        reason: "This issuer offers the NL Wallet (v0.6.0) the pre-authorized code flow only; whether the NL Wallet completes the authorization code flow at an external issuer is not tested. The authorization code flow is offered on the eudi profile."
      wallet:
        status: deviation
        tests:
          - "services/eudi-credential-issuer/internal/httpapi:TestAuthorizationCodeMetadata"
        reason: "The combined profile carries pre-authorized offers that both wallets can read (QTSP route); this issuer offers the NL Wallet (v0.6.0) the pre-authorized code flow only, so EUDI wallets use the eudi profile for the authorization code flow."
  HAIP-4-02:
    status: passed
    tests:
      - "services/eudi-credential-issuer/internal/httpapi:TestIssueNL"
      - "services/eudi-credential-issuer/internal/httpapi:TestIssueEUDI"
