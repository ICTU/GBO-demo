      - "services/eudi-credential-issuer/internal/httpapi:TestALoginReturnsACodeToTheWallet"
      - "services/eudi-credential-issuer/internal/httpapi:TestACodeBoundToADPoPKey"
      - "services/eudi-credential-issuer/internal/httpapi:TestDPoPJKTInThePushedRequest"
