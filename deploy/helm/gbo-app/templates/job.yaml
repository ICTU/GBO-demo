{{- if .Values.job.enabled }}
{{- if .Values.route.enabled }}
{{- fail "job.enabled and route.enabled are mutually exclusive: a task that runs to completion serves no traffic" }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "gbo-app.jobName" . }}
  {{- with .Values.job.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "gbo-app.labels" . | nindent 4 }}
spec:
  backoffLimit: {{ .Values.job.backoffLimit }}
  {{- /*
  Pinned to the Job defaults on purpose, and not wired to replicaCount: two
  pods running the same schema migration concurrently is the failure this
  workload shape exists to prevent.
  */}}
  parallelism: 1
  completions: 1
  {{- with .Values.job.activeDeadlineSeconds }}
  activeDeadlineSeconds: {{ . }}
  {{- end }}
  {{- with .Values.job.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ . }}
  {{- end }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "gbo-app.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "gbo-app.podSpec" . | trim | nindent 6 }}
{{- end }}
