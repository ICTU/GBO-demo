replicaCount: 1

image:
  # Example: ghcr.io/ictu/gbo-demo/bsnk-mock
  repository: ghcr.io/ictu/gbo-demo/bsnk-mock
  # Defaults to Chart.appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

containerPort: 8080

# Override the image entrypoint and arguments when needed.
command: []
args: []

# Example:
# env:
#   - name: FOO
#     value: bar
env: []

# Example:
# envFrom:
#   - secretRef:
#       name: eudi-secrets
envFrom: []

# Run this release as a one-shot Job instead of a long-running Deployment.
# The two shapes are mutually exclusive: a release either serves traffic
# (Deployment + Service + optional HTTPRoute) or runs a task to completion
# (Job, no Service, no probes, no container port).
#
# Use it for work that must happen once per release and never twice at the
# same time — the schema migrations. Work that must happen before *this* pod's
# main container starts, such as materializing a config file, belongs in
# initContainers instead. See deploy/helm/gbo-app/README.md.
job:
  enabled: false
  restartPolicy: Never
  # Retries of the whole pod before the Job is marked Failed.
  backoffLimit: 3
  # Fail the Job instead of hanging forever when a migration wedges.
  # Empty = no deadline.
  activeDeadlineSeconds: 600
  # Delete the finished Job this many seconds after it ends. Empty keeps it
  # until the next release replaces it, which is what makes a failed
  # migration inspectable with `kubectl logs job/...`.
  ttlSecondsAfterFinished: null
  annotations: {}

# Native Kubernetes init containers. Each entry owns its image, command,
# environment, security context, resources and volume mounts.
initContainers: []

# Native Kubernetes volume mounts and pod volumes.
volumeMounts: []
volumes: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 50m
    memory: 64Mi

health:
  enabled: true
  scheme: HTTP
  # Optional numeric container port for the probes when the app serves
  # health on a different port than containerPort (e.g. OpenFTV PDP:
  # svc on 8443, health on 8080). Empty = the named http port.
  port: null
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3
healthPath: /healthz

route:
  enabled: false
  hostname: ""
  parentRefs:
    - name: default-gateway
      namespace: fds-public
      sectionName: https

deploymentAnnotations: {}
# Override the default RollingUpdate strategy, for example with
# type: Recreate when a single-replica workload mounts a ReadWriteOnce volume.
deploymentStrategy: {}
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}
