# Apply in the PDP namespace before installing the PDP release. Change the
# register URI if its Kubernetes service name, namespace or port differs.
# Keep the pull mapping in sync with
# services/openftv-pdp/pip-pull/dvtp-onboarding.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openftv-pdp-pip-pull
data:
  dvtp-onboarding.yaml: |
    description: DvTP onboarding register
    sources:
      - name: dvtp-onboarding-register
        requests:
          - name: participants
            method: GET
            uri: http://dvtp-onboarding-register:4015/internal/openftv/participants
            timeout: 2s
            interval: 5s
            initialInterval: 1s
            contentType: application/json
            mapping:
              entities:
                - base: ""
                  typeValue: dvtp_participant
                  idField: peer_id
                  attributes:
                    - base: ""
                      map:
                        - keyValue: name
                          valueField: name
                          required: true
                        - keyValue: active
                          valueField: active
                          required: true
                        - keyValue: allowed_source_peer_ids
                          valueField: allowed_source_peer_ids
                          required: true
                        - keyValue: acts_for
                          valueField: acts_for
                          required: true
