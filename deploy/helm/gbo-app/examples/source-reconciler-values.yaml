image:
  repository: ghcr.io/ictu/gbo-demo/eudi-adapter
  tag: latest

command: ["./eudi-adapter"]
args:
  - reconcile-sources
  - --watch
  - --interval=30s
  - --manager-url=https://fsc-manager:9443
  - --manager-ca=/fsc-manager/intermediate_ca.pem
  - --manager-cert=/fsc-manager/internal-cert.pem
  - --manager-key=/fsc-manager/internal-cert-key.pem
  - --consumer-peer-id=0000009961MINEZK0000
  - --outway-url=http://fsc-outway:8080
  - --schema=/schemas/gbo-source-metadata-v1.schema.json
  - --type-metadata-base-url=https://adapter.example
  - --sources-dir=/sources
  - --storage-backend=postgres
  - --certificate-store=public-filesystem
  - --database-schema=source_registry
  - --database-reader-role=source_registry_reader
  - --migrate
  - --secrets-dir=/public-certificates
  - --reader-public-url=https://issuer.example
  - --auto-promote

env:
  - name: SOURCE_REGISTRY_DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: source-registry-writer
        key: uri

health:
  enabled: false

volumeMounts:
  - name: source-configurations
    mountPath: /sources
    readOnly: true
  - name: metadata-schemas
    mountPath: /schemas
    readOnly: true
  - name: fsc-manager-client
    mountPath: /fsc-manager
    readOnly: true
  - name: source-certificates
    mountPath: /public-certificates
    readOnly: true

volumes:
  - name: source-configurations
    configMap:
      name: gbo-source-configurations
  - name: metadata-schemas
    configMap:
      name: gbo-source-metadata-schemas
  - name: fsc-manager-client
    secret:
      secretName: gbo-fsc-manager-client
  - name: source-certificates
    secret:
      secretName: gbo-source-certificates
      # Project only public leaf and CA certificates. Private-key Secret keys
      # are intentionally unavailable to the reconciler container.
      items:
        - key: issuer-ca-cert.pem
          path: development-ca/issuer-ca-cert.pem
        - key: reader-ca-cert.pem
          path: development-ca/reader-ca-cert.pem
        - key: belastingdienst-issuer-cert.der.b64
          path: belastingdienst/issuer-cert.der.b64
        - key: belastingdienst-reader-cert.der.b64
          path: belastingdienst/reader-cert.der.b64
        - key: belastingdienst-status-cert.der.b64
          path: belastingdienst/status-cert.der.b64
        - key: rvig-issuer-cert.der.b64
          path: rvig/issuer-cert.der.b64
        - key: rvig-reader-cert.der.b64
          path: rvig/reader-cert.der.b64
        - key: rvig-status-cert.der.b64
          path: rvig/status-cert.der.b64
