<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inloggen met DigiD (mock)</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;color:#1a1a1a;background:#f3f3f3}
header{background:#fff;border-bottom:4px solid #e17000;padding:1rem 1.5rem;display:flex;align-items:center;gap:.8rem}
.logo{background:#e17000;color:#fff;font-weight:700;padding:.35rem .6rem;border-radius:4px}
main{max-width:30rem;margin:2rem auto;background:#fff;padding:1.5rem 2rem;border:1px solid #ddd}
.banner{background:#fff3cd;border:2px solid #b8860b;padding:.6rem .8rem;margin-bottom:1rem;font-size:.9rem}
label{display:block;margin:.8rem 0 .3rem;font-weight:600}
input[type=text],input[type=password]{width:100%;box-sizing:border-box;padding:.5rem;font-size:1rem}
.error{color:#b00020;font-weight:600}
button{margin-top:1.2rem;padding:.6rem 1.4rem;font-size:1rem;border:0;border-radius:4px;cursor:pointer}
.primary{background:#e17000;color:#fff}.secondary{background:#eee}
</style></head><body>
<header><span class="logo">DigiD</span><span>Inloggen (mock)</span></header>
<main>
<p class="banner"><strong>Mock van DigiD — testomgeving.</strong> De gebruikersnaam doet niets; vul in het wachtwoordveld het BSN in. Er wordt niets gecontroleerd.</p>
<h1>Inloggen met gebruikersnaam en wachtwoord</h1>
{{if .Message}}<p class="error" role="alert">{{.Message}}</p>{{end}}
<form method="post" action="{{.Action}}">
<input type="hidden" name="transaction" value="{{.TransactionID}}">
<label for="username">DigiD gebruikersnaam</label>
<input type="text" id="username" name="username" value="{{.Username}}" autocomplete="off">
<label for="bsn">Wachtwoord (BSN)</label>
<input type="password" id="bsn" name="bsn" inputmode="numeric" autocomplete="off" required>
<button type="submit" class="primary">Inloggen</button>
<button type="submit" class="secondary" formaction="{{.Cancel}}" name="decision" value="deny" formnovalidate>Annuleren</button>
</form>
</main></body></html>
