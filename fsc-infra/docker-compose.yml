    ports:
      - "${GBO_PUBLIC_BIND_ADDRESS:+${GBO_PUBLIC_BIND_ADDRESS}:}${FSC_PORT_CR_CONTROLLER:-8098}:3001"
    volumes: [./orgs/consent-register/pki:/certs:ro]
    environment:
      <<: *controller-env
      MANAGER_ADDRESS_INTERNAL: https://cr-manager:9443
      STORAGE_POSTGRES_DSN: "postgresql://postgres:${FSC_POSTGRES_PASSWORD}@postgres:5432/fsc_cr_controller?sslmode=disable&connect_timeout=2"
    depends_on:
      postgres: {condition: service_healthy}
      cr-manager: {condition: service_started}
      cr-migrations-controller: {condition: service_completed_successfully}

  cr-manager:
    <<: *manager
    # Counter-signs a connection to consent-status only when the OpenFTV PDP
    # allows it (policies/fsc/autosign.rego), as the source Managers do. The
    # PDP's own peer is admitted to this peer in the onboarding register's
    # configuration; no other peer is.
    command: *sign-by-pdp
    volumes:
      - ./orgs/consent-register/pki:/certs:ro
      - ../services/openftv-pdp/certs:/authzen-ca:ro
    environment:
      <<: *manager-env
      TLS_GROUP_CERT: /certs/org/consent-register.pem
      TLS_GROUP_KEY: /certs/org/consent-register-key.pem
      TLS_GROUP_TOKEN_CERT: /certs/org/consent-register.pem
      TLS_GROUP_TOKEN_KEY: /certs/org/consent-register-key.pem
      TLS_GROUP_CONTRACT_CERT: /certs/org/consent-register.pem
      TLS_GROUP_CONTRACT_KEY: /certs/org/consent-register-key.pem
      CONTROLLER_REGISTRATION_API_ADDRESS: https://cr-controller:9443
      TX_LOG_API_ADDRESS: https://cr-txlog-api:9443
      SELF_ADDRESS: "https://cr-manager:8443"
      STORAGE_POSTGRES_DSN: "postgresql://postgres:${FSC_POSTGRES_PASSWORD}@postgres:5432/fsc_cr_manager?sslmode=disable&connect_timeout=2"
    depends_on:
      postgres: {condition: service_healthy}
      cr-migrations-manager: {condition: service_completed_successfully}
      cr-txlog-api: {condition: service_started}

  cr-inway:
    <<: *inway
    volumes: [./orgs/consent-register/pki:/certs:ro]
    environment:
      <<: *inway-env
      TLS_GROUP_CERT: /certs/org/consent-register.pem
      TLS_GROUP_KEY: /certs/org/consent-register-key.pem
      NAME: CrInway-01
      SELF_ADDRESS: "https://cr-inway:443"
      CONTROLLER_REGISTRATION_API_ADDRESS: https://cr-controller:9443
      TX_LOG_API_ADDRESS: https://cr-txlog-api:9443
      MANAGER_INTERNAL_UNAUTHENTICATED_ADDRESS: https://cr-manager:9444
      # No AuthZEN hook: the connection contract is the authorization for
      # consent-status, and the register reads the calling peer from the
      # Fsc-Authorization token this Inway forwards (#383).
    depends_on: [cr-controller, cr-manager, cr-txlog-api]

  cr-txlog-api:
    <<: *txlog-api
    volumes: [./orgs/consent-register/pki:/certs:ro]
    environment:
