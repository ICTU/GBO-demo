  # === Consent register (GBO, provider of consent-status) ================
  # The register's own peer. Its Inway publishes only the status lookup,
  # which the PDP of a source asks per evaluation (#383).

  cr-migrations-controller:
    <<: *controller-migrations
    volumes: [./orgs/consent-register/pki:/certs:ro]
    environment:
      <<: *fsc-env
      POSTGRES_DSN: "postgresql://postgres:${FSC_POSTGRES_PASSWORD}@postgres:5432/fsc_cr_controller?sslmode=disable&connect_timeout=10"

  cr-migrations-manager:
    <<: *manager-migrations
    volumes: [./orgs/consent-register/pki:/certs:ro]
    environment:
      <<: *fsc-env
      POSTGRES_DSN: "postgresql://postgres:${FSC_POSTGRES_PASSWORD}@postgres:5432/fsc_cr_manager?sslmode=disable&connect_timeout=10"

  cr-migrations-txlog-api:
    <<: *txlog-api-migrations
    volumes: [./orgs/consent-register/pki:/certs:ro]
    environment:
      <<: *fsc-env
      POSTGRES_DSN: "postgresql://postgres:${FSC_POSTGRES_PASSWORD}@postgres:5432/fsc_cr_txlog?sslmode=disable&connect_timeout=10"

  cr-controller:
