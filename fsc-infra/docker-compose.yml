# Project name is parameterizable so multiple worktrees can each run
# their own fsc-infra instance side by side (set FSC_PROJECT_NAME in
# fsc-infra/.env). Defaults to the historical single-tenant name.
name: ${FSC_PROJECT_NAME:-fsc-infra}

# Self-hosted cert-authority + directory-peer for the GBO-DEMO group.
#
# Cert-authority:
#   cfssl     — CA, signs CSRs with the intermediate-CA (from pki/generate-root-ca.sh).
#   certportal — web/REST frontend for CSR submission.
#
# Directory-peer + directory-UI:
#   postgres              — shared, separate databases per role.
#   directory-controller  — config UI for the directory-peer.
#   directory-manager     — the "directory" — the peer all others point at.
#   directory-inway       — reverse-proxy for inbound peer connections.
#   directory-ui          — public web frontend showing the group registry.
#
# Assumptions:
#   - pki/generate-root-ca.sh has run: ca/*.pem exist.
#   - pki/bootstrap-peer.sh directory-peer directory-ui has run after make fsc-up:
#     directory-peer/pki/{org,internal}/* and directory-ui/pki/org/* exist.
#   - GROUP_ID = fsc-demo (arbitrary; our own group name).

# OpenFSC v2.4.0. Bump every image here together.
x-openfsc-images:
  controller: &controller-image federatedserviceconnectivity/controller:v2.4.0
  manager: &manager-image federatedserviceconnectivity/manager:v2.4.0
  inway: &inway-image federatedserviceconnectivity/inway:v2.4.0
  outway: &outway-image federatedserviceconnectivity/outway:v2.4.0
  txlog-api: &txlog-api-image federatedserviceconnectivity/txlog-api:v2.4.0
  ca-certportal: &ca-certportal-image federatedserviceconnectivity/ca-certportal:v2.4.0
  directory-ui: &directory-ui-image federatedserviceconnectivity/directory-ui:v2.4.0

# === FSC peer template =================================================
# Every peer runs the same OpenFSC components. A template per component
# holds what all peers share; each peer's services below add only their
# own names, certificates and databases.
#   controller — the peer's admin UI; its Inways and Outways register here.
#   manager    — signs contracts and talks to the other peers' Managers.
#   inway      — receives calls for the services the peer publishes.
#   outway     — makes the peer's calls to other peers' services.
#   txlog-api  — the peer's transaction log.
#   *-migrations-* — one-shot: creates or updates a component's database.

# Paths in /certs, where a service mounts its peer's pki directory.
x-fsc-env: &fsc-env
  TLS_GROUP_ROOT_CERT: /certs/org/root.pem
  TLS_ROOT_CERT: /certs/internal/intermediate_ca.pem
  TLS_CERT: /certs/internal/internal-cert.pem
  TLS_KEY: /certs/internal/internal-cert-key.pem
  GROUP_ID: fsc-demo

# Each migration runs once and its peer waits for it, so a failed connect
# stops the start. connect_timeout covers the name lookup as well, and at a
# cold start Docker's DNS can take seconds to answer while dozens of
# containers start together; hence 10 s in the migrations' POSTGRES_DSN,
# where the services use 2 s.
x-controller-migrations: &controller-migrations
  image: *controller-image
  restart: "no"
  command: [/usr/local/bin/controller, migrate, up]
  depends_on: &after-postgres-init
    postgres-init:
      condition: service_completed_successfully

x-manager-migrations: &manager-migrations
  image: *manager-image
  restart: "no"
  command: [/usr/local/bin/manager, migrate, up]
  depends_on: *after-postgres-init

x-txlog-api-migrations: &txlog-api-migrations
  image: *txlog-api-image
  restart: "no"
  command: [/usr/local/bin/txlog-api, migrate, up]
  depends_on: *after-postgres-init

x-controller: &controller
  image: *controller-image
  restart: unless-stopped
  environment: &controller-env
    <<: *fsc-env
    LISTEN_ADDRESS_UI: 0.0.0.0:3001
    LISTEN_ADDRESS_REGISTRATION_API: 0.0.0.0:9443
    LISTEN_ADDRESS_ADMINISTRATION_API: 0.0.0.0:9444
    DIRECTORY_ADDRESS: https://directory-manager:8443
    AUDITLOG_TYPE: "stdout"

x-manager: &manager
  image: *manager-image
  restart: unless-stopped
  environment: &manager-env
    <<: *fsc-env
    TLS_INTERNAL_UNAUTHENTICATED_ROOT_CERT: /certs/internal/intermediate_ca.pem
    TLS_INTERNAL_UNAUTHENTICATED_CERT: /certs/internal/internal-cert.pem
    TLS_INTERNAL_UNAUTHENTICATED_KEY: /certs/internal/internal-cert-key.pem
    LISTEN_ADDRESS_INTERNAL: 0.0.0.0:9443
    LISTEN_ADDRESS_INTERNAL_UNAUTHENTICATED: 0.0.0.0:9444
    LISTEN_ADDRESS_EXTERNAL: 0.0.0.0:8443
    DIRECTORY_MANAGER_ADDRESS: "https://directory-manager:8443"
    DIRECTORY_PEER_ID: "99999999900000000000"

x-inway: &inway
  image: *inway-image
  restart: unless-stopped
  environment: &inway-env
    <<: *fsc-env
    LISTEN_ADDRESS: 0.0.0.0:443

x-outway: &outway
  image: *outway-image
  restart: unless-stopped
  environment: &outway-env
    <<: *fsc-env
    LISTEN_ADDRESS: 0.0.0.0:8080
    ENABLE_GRANT_HASH_SUGGESTION: "true"

x-txlog-api: &txlog-api
  image: *txlog-api-image
  restart: unless-stopped
  environment: &txlog-api-env
    <<: *fsc-env
    LISTEN_ADDRESS: 0.0.0.0:9443
    LISTEN_ADDRESS_PLAIN: 0.0.0.0:8080

services:
  # === Cert-authority ====================================================
  cfssl:
    image: gbo-demo/pki-tools:local
    build:
      context: ./pki
      dockerfile: Dockerfile.pki
    command:
      - cfssl
      - serve
      - -address=0.0.0.0
      - -port=8888
      - -ca=/pki/ca/intermediate.pem
      - -ca-key=/pki/ca/intermediate-key.pem
      - -config=/pki/cfssl-signing-config.json
    volumes:
      - ./pki:/pki:ro
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - "curl -fsS -X POST -H 'Content-Type: application/json' -d '{}' http://localhost:8888/api/v1/cfssl/info || exit 1"
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: 3s
      retries: 10
      start_period: 60s
      start_interval: 2s

  certportal:
    image: *ca-certportal-image
    command:
      - /usr/local/bin/ca-certportal
      - serve
      - --listen-address=0.0.0.0:8080
      - --ca-host=http://cfssl:8888
      - --include-issuer-cert=true
    ports:
      - "${GBO_PUBLIC_BIND_ADDRESS:+${GBO_PUBLIC_BIND_ADDRESS}:}${FSC_PORT_CERTPORTAL:-8091}:8080"
    depends_on:
      cfssl:
        condition: service_healthy

  # === Directory-peer stack ==============================================
  postgres:
    image: postgres:17.10-alpine
    restart: unless-stopped
    # One server holds every peer's Controller, Manager and txlog databases,
    # each with a connection pool of its own. The default of 100 runs out
    # at ten peers.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${FSC_POSTGRES_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres" ]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Holds the only list of FSC databases (postgres/init-databases.sh). Runs on
  # every `up` and is idempotent, so an existing volume gets new databases too.
  postgres-init:
    image: postgres:17.10-alpine
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${FSC_POSTGRES_PASSWORD}
      PGDATABASE: postgres
    command: ["sh", "/init/init-databases.sh"]
    volumes:
      - ./postgres/init-databases.sh:/init/init-databases.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  directory-migrations-controller:
    <<: *controller-migrations
    environment:
      <<: *fsc-env
      POSTGRES_DSN: "postgresql://postgres:${FSC_POSTGRES_PASSWORD}@postgres:5432/fsc_dir_controller?sslmode=disable&connect_timeout=10"

  directory-migrations-manager:
    <<: *manager-migrations
    environment:
      <<: *fsc-env
      POSTGRES_DSN: "postgresql://postgres:${FSC_POSTGRES_PASSWORD}@postgres:5432/fsc_dir_manager?sslmode=disable&connect_timeout=10"

  directory-migrations-txlog-api:
    <<: *txlog-api-migrations
    environment:
      <<: *fsc-env
      POSTGRES_DSN: "postgresql://postgres:${FSC_POSTGRES_PASSWORD}@postgres:5432/fsc_dir_txlog?sslmode=disable&connect_timeout=10"

  directory-controller:
    <<: *controller
    ports:
      - "${GBO_PUBLIC_BIND_ADDRESS:+${GBO_PUBLIC_BIND_ADDRESS}:}${FSC_PORT_DIRECTORY_CONTROLLER:-8092}:3001"
    volumes: [./directory-peer/pki:/certs:ro]
    environment:
      <<: *controller-env
      MANAGER_ADDRESS_INTERNAL: https://directory-manager:9443
      STORAGE_POSTGRES_DSN: "postgresql://postgres:${FSC_POSTGRES_PASSWORD}@postgres:5432/fsc_dir_controller?sslmode=disable&connect_timeout=2"
    depends_on:
      postgres: {condition: service_healthy}
      directory-manager: {condition: service_started}
      directory-migrations-controller: {condition: service_completed_successfully}

  directory-manager:
    <<: *manager
    # Seed automation: the Directory-peer auto-signs servicePublication
    # so new services appear in the directory without manual review.
    # (Directory is a registry, not a policy party — auto-sign fits.)
    command: ["/usr/local/bin/manager", "serve", "--auto-sign-grants=servicePublication"]
    volumes: [./directory-peer/pki:/certs:ro]
    environment:
      <<: *manager-env
      TLS_GROUP_CERT: /certs/org/directory-peer.pem
      TLS_GROUP_KEY: /certs/org/directory-peer-key.pem
      TLS_GROUP_TOKEN_CERT: /certs/org/directory-peer.pem
      TLS_GROUP_TOKEN_KEY: /certs/org/directory-peer-key.pem
      TLS_GROUP_CONTRACT_CERT: /certs/org/directory-peer.pem
      TLS_GROUP_CONTRACT_KEY: /certs/org/directory-peer-key.pem
      CONTROLLER_REGISTRATION_API_ADDRESS: https://directory-controller:9443
      TX_LOG_API_ADDRESS: https://directory-txlog-api:9443
      # Self-referential: the directory-Manager points at itself.
      SELF_ADDRESS: "https://directory-manager:8443"
      STORAGE_POSTGRES_DSN: "postgresql://postgres:${FSC_POSTGRES_PASSWORD}@postgres:5432/fsc_dir_manager?sslmode=disable&connect_timeout=2"
    depends_on:
      postgres: {condition: service_healthy}
      directory-migrations-manager: {condition: service_completed_successfully}
      directory-txlog-api: {condition: service_started}

  directory-inway:
    <<: *inway
    volumes: [./directory-peer/pki:/certs:ro]
    environment:
      <<: *inway-env
      TLS_GROUP_CERT: /certs/org/directory-peer.pem
      TLS_GROUP_KEY: /certs/org/directory-peer-key.pem
      NAME: DirectoryInway-01
      SELF_ADDRESS: "https://directory-inway:443"
      CONTROLLER_REGISTRATION_API_ADDRESS: https://directory-controller:9443
      MANAGER_INTERNAL_UNAUTHENTICATED_ADDRESS: https://directory-manager:9444
      TX_LOG_API_ADDRESS: https://directory-txlog-api:9443
    depends_on: [directory-controller, directory-manager, directory-txlog-api]

  directory-txlog-api:
    <<: *txlog-api
    volumes: [./directory-peer/pki:/certs:ro]
    environment:
      <<: *txlog-api-env
      STORAGE_POSTGRES_DSN: "postgresql://postgres:${FSC_POSTGRES_PASSWORD}@postgres:5432/fsc_dir_txlog?sslmode=disable&connect_timeout=2"
    depends_on:
      postgres: {condition: service_healthy}
      directory-migrations-txlog-api: {condition: service_completed_successfully}

  directory-ui:
    image: *directory-ui-image
    restart: unless-stopped
    ports:
      - "${GBO_PUBLIC_BIND_ADDRESS:+${GBO_PUBLIC_BIND_ADDRESS}:}${FSC_PORT_DIRECTORY_UI:-8093}:3001"
    volumes:
      - ./directory-ui/pki:/certs:ro
    environment:
      LISTEN_ADDRESS: 0.0.0.0:3001
      DIRECTORY_MANAGER_ADDRESS: "https://directory-manager:8443"
      GROUP_ID: fsc-demo
      TLS_GROUP_ROOT_CERT: /certs/org/root.pem
      TLS_GROUP_CERT: /certs/org/directory-ui.pem
      TLS_GROUP_KEY: /certs/org/directory-ui-key.pem
    depends_on:
      - directory-manager

  # === EDI-issuer-org (consumer) ========================================

  edi-migrations-controller:
    <<: *controller-migrations
    volumes: [./orgs/edi-issuer/pki:/certs:ro]
    environment:
      <<: *fsc-env
      POSTGRES_DSN: "postgresql://postgres:${FSC_POSTGRES_PASSWORD}@postgres:5432/fsc_edi_controller?sslmode=disable&connect_timeout=10"

  edi-migrations-manager:
    <<: *manager-migrations
    volumes: [./orgs/edi-issuer/pki:/certs:ro]
    environment:
      <<: *fsc-env
      POSTGRES_DSN: "postgresql://postgres:${FSC_POSTGRES_PASSWORD}@postgres:5432/fsc_edi_manager?sslmode=disable&connect_timeout=10"

  edi-migrations-txlog-api:
    <<: *txlog-api-migrations
    volumes: [./orgs/edi-issuer/pki:/certs:ro]
    environment:
      <<: *fsc-env
      POSTGRES_DSN: "postgresql://postgres:${FSC_POSTGRES_PASSWORD}@postgres:5432/fsc_edi_txlog?sslmode=disable&connect_timeout=10"

  edi-controller:
    <<: *controller
    ports:
      - "${GBO_PUBLIC_BIND_ADDRESS:+${GBO_PUBLIC_BIND_ADDRESS}:}${FSC_PORT_EDI_CONTROLLER:-8094}:3001"
    volumes: [./orgs/edi-issuer/pki:/certs:ro]
    environment:
      <<: *controller-env
      MANAGER_ADDRESS_INTERNAL: https://edi-manager:9443
      STORAGE_POSTGRES_DSN: "postgresql://postgres:${FSC_POSTGRES_PASSWORD}@postgres:5432/fsc_edi_controller?sslmode=disable&connect_timeout=2"
    depends_on:
      postgres: {condition: service_healthy}
      edi-manager: {condition: service_started}
      edi-migrations-controller: {condition: service_completed_successfully}

  edi-manager:
    <<: *manager
    volumes: [./orgs/edi-issuer/pki:/certs:ro]
    environment:
      <<: *manager-env
      TLS_GROUP_CERT: /certs/org/edi-issuer.pem
      TLS_GROUP_KEY: /certs/org/edi-issuer-key.pem
      TLS_GROUP_TOKEN_CERT: /certs/org/edi-issuer.pem
      TLS_GROUP_TOKEN_KEY: /certs/org/edi-issuer-key.pem
      TLS_GROUP_CONTRACT_CERT: /certs/org/edi-issuer.pem
      TLS_GROUP_CONTRACT_KEY: /certs/org/edi-issuer-key.pem
      CONTROLLER_REGISTRATION_API_ADDRESS: https://edi-controller:9443
      TX_LOG_API_ADDRESS: https://edi-txlog-api:9443
      SELF_ADDRESS: "https://edi-manager:8443"
      STORAGE_POSTGRES_DSN: "postgresql://postgres:${FSC_POSTGRES_PASSWORD}@postgres:5432/fsc_edi_manager?sslmode=disable&connect_timeout=2"
    depends_on:
      postgres: {condition: service_healthy}
      edi-migrations-manager: {condition: service_completed_successfully}
      edi-txlog-api: {condition: service_started}

  edi-outway:
    <<: *outway
    ports:
      # No login of its own: see GBO_INTERNAL_BIND_ADDRESS in .env.example.
      - "${GBO_INTERNAL_BIND_ADDRESS:-127.0.0.1}:${FSC_PORT_EDI_OUTWAY:-8087}:8080"
    volumes: [./orgs/edi-issuer/pki:/certs:ro]
    environment:
      <<: *outway-env
      TLS_GROUP_CERT: /certs/org/edi-issuer.pem
      TLS_GROUP_KEY: /certs/org/edi-issuer-key.pem
      NAME: EdiOutway-01
      CONTROLLER_REGISTRATION_API_ADDRESS: https://edi-controller:9443
      TX_LOG_API_ADDRESS: https://edi-txlog-api:9443
      MANAGER_INTERNAL_ADDRESS: https://edi-manager:9443
    depends_on: [edi-controller, edi-manager, edi-txlog-api]

  edi-txlog-api:
    <<: *txlog-api
    volumes: [./orgs/edi-issuer/pki:/certs:ro]
    environment:
      <<: *txlog-api-env
      STORAGE_POSTGRES_DSN: "postgresql://postgres:${FSC_POSTGRES_PASSWORD}@postgres:5432/fsc_edi_txlog?sslmode=disable&connect_timeout=2"
    depends_on:
      postgres: {condition: service_healthy}
      edi-migrations-txlog-api: {condition: service_completed_successfully}

  # === Hypotheekverlener-mock (DvTP consumer) ============================

  hv-migrations-controller:
    <<: *controller-migrations
    volumes: [./orgs/hypotheekverlener-mock/pki:/certs:ro]
    environment:
      <<: *fsc-env
      POSTGRES_DSN: "postgresql://postgres:${FSC_POSTGRES_PASSWORD}@postgres:5432/fsc_hv_controller?sslmode=disable&connect_timeout=10"

  hv-migrations-manager:
    <<: *manager-migrations
    volumes: [./orgs/hypotheekverlener-mock/pki:/certs:ro]
    environment:
      <<: *fsc-env
      POSTGRES_DSN: "postgresql://postgres:${FSC_POSTGRES_PASSWORD}@postgres:5432/fsc_hv_manager?sslmode=disable&connect_timeout=10"

  hv-migrations-txlog-api:
    <<: *txlog-api-migrations
    volumes: [./orgs/hypotheekverlener-mock/pki:/certs:ro]
    environment:
      <<: *fsc-env
      POSTGRES_DSN: "postgresql://postgres:${FSC_POSTGRES_PASSWORD}@postgres:5432/fsc_hv_txlog?sslmode=disable&connect_timeout=10"

  hv-controller:
    <<: *controller
    ports:
      - "${GBO_PUBLIC_BIND_ADDRESS:+${GBO_PUBLIC_BIND_ADDRESS}:}${FSC_PORT_HV_CONTROLLER:-8096}:3001"
    volumes: [./orgs/hypotheekverlener-mock/pki:/certs:ro]
    environment:
      <<: *controller-env
      MANAGER_ADDRESS_INTERNAL: https://hv-manager:9443
      STORAGE_POSTGRES_DSN: "postgresql://postgres:${FSC_POSTGRES_PASSWORD}@postgres:5432/fsc_hv_controller?sslmode=disable&connect_timeout=2"
    depends_on:
      postgres: {condition: service_healthy}
      hv-manager: {condition: service_started}
      hv-migrations-controller: {condition: service_completed_successfully}

  hv-manager:
    <<: *manager
    volumes: [./orgs/hypotheekverlener-mock/pki:/certs:ro]
    environment:
      <<: *manager-env
      TLS_GROUP_CERT: /certs/org/hypotheekverlener.pem
      TLS_GROUP_KEY: /certs/org/hypotheekverlener-key.pem
      TLS_GROUP_TOKEN_CERT: /certs/org/hypotheekverlener.pem
      TLS_GROUP_TOKEN_KEY: /certs/org/hypotheekverlener-key.pem
      TLS_GROUP_CONTRACT_CERT: /certs/org/hypotheekverlener.pem
      TLS_GROUP_CONTRACT_KEY: /certs/org/hypotheekverlener-key.pem
      CONTROLLER_REGISTRATION_API_ADDRESS: https://hv-controller:9443
      TX_LOG_API_ADDRESS: https://hv-txlog-api:9443
      SELF_ADDRESS: "https://hv-manager:8443"
      STORAGE_POSTGRES_DSN: "postgresql://postgres:${FSC_POSTGRES_PASSWORD}@postgres:5432/fsc_hv_manager?sslmode=disable&connect_timeout=2"
    depends_on:
      postgres: {condition: service_healthy}
      hv-migrations-manager: {condition: service_completed_successfully}
      hv-txlog-api: {condition: service_started}

  hv-outway:
    <<: *outway
    volumes: [./orgs/hypotheekverlener-mock/pki:/certs:ro]
    environment:
      <<: *outway-env
      TLS_GROUP_CERT: /certs/org/hypotheekverlener.pem
      TLS_GROUP_KEY: /certs/org/hypotheekverlener-key.pem
      NAME: HvOutway-01
      CONTROLLER_REGISTRATION_API_ADDRESS: https://hv-controller:9443
      TX_LOG_API_ADDRESS: https://hv-txlog-api:9443
      MANAGER_INTERNAL_ADDRESS: https://hv-manager:9443
    depends_on: [hv-controller, hv-manager, hv-txlog-api]

  hv-txlog-api:
    <<: *txlog-api
    volumes: [./orgs/hypotheekverlener-mock/pki:/certs:ro]
    environment:
      <<: *txlog-api-env
      STORAGE_POSTGRES_DSN: "postgresql://postgres:${FSC_POSTGRES_PASSWORD}@postgres:5432/fsc_hv_txlog?sslmode=disable&connect_timeout=2"
    depends_on:
      postgres: {condition: service_healthy}
      hv-migrations-txlog-api: {condition: service_completed_successfully}

  # === Belastingdienst-mock (provider) ===================================

  bd-migrations-controller:
    <<: *controller-migrations
    volumes: [./orgs/belastingdienst-mock/pki:/certs:ro]
    environment:
      <<: *fsc-env
      POSTGRES_DSN: "postgresql://postgres:${FSC_POSTGRES_PASSWORD}@postgres:5432/fsc_bd_controller?sslmode=disable&connect_timeout=10"

  bd-migrations-manager:
    <<: *manager-migrations
    volumes: [./orgs/belastingdienst-mock/pki:/certs:ro]
    environment:
      <<: *fsc-env
      POSTGRES_DSN: "postgresql://postgres:${FSC_POSTGRES_PASSWORD}@postgres:5432/fsc_bd_manager?sslmode=disable&connect_timeout=10"

  bd-migrations-txlog-api:
    <<: *txlog-api-migrations
    volumes: [./orgs/belastingdienst-mock/pki:/certs:ro]
    environment:
      <<: *fsc-env
      POSTGRES_DSN: "postgresql://postgres:${FSC_POSTGRES_PASSWORD}@postgres:5432/fsc_bd_txlog?sslmode=disable&connect_timeout=10"

  bd-controller:
    <<: *controller
    ports:
      - "${GBO_PUBLIC_BIND_ADDRESS:+${GBO_PUBLIC_BIND_ADDRESS}:}${FSC_PORT_BD_CONTROLLER:-8095}:3001"
    volumes: [./orgs/belastingdienst-mock/pki:/certs:ro]
    environment:
      <<: *controller-env
      MANAGER_ADDRESS_INTERNAL: https://bd-manager:9443
      STORAGE_POSTGRES_DSN: "postgresql://postgres:${FSC_POSTGRES_PASSWORD}@postgres:5432/fsc_bd_controller?sslmode=disable&connect_timeout=2"
    depends_on:
      postgres: {condition: service_healthy}
      bd-manager: {condition: service_started}
      bd-migrations-controller: {condition: service_completed_successfully}

  bd-manager:
    <<: *manager
    # Belastingdienst-mock as service-provider decides on incoming
    # contracts by POLICY, not by a flag: every contract a peer submits
    # is put to the OpenFTV PDP as an AuthZEN evaluation, and only signed
    # on decision=true. The policy is policies/fsc/autosign.rego —
    # package doelbinding.auto_sign_contract, because the Manager sends
    # context.doelbinding="auto_sign_contract" and OpenFTV derives the
    # OPA entrypoint from that.
    #
    # This replaces --auto-sign-grants=serviceConnection. The Manager
    # refuses to run with both (manager/cmd/serve.go: "cannot combine the
    # auto sign grants option with an auto-sign policy decision point" is
    # fatal), so the serviceConnection-only gate now lives in the policy.
    #
    # Both source Managers use this policy. Only directory-manager keeps
    # auto-signing by grant type because the directory is a registry rather
    # than a policy party.
    command: &sign-by-pdp
      [
        "/usr/local/bin/manager",
        "serve",
        "--authzen-auto-sign-pdp-address=https://openftv-pdp:8443/authzen/v1",
        "--authzen-auto-sign-pdp-root-ca=/authzen-ca/pdp-service.pem",
      ]
    volumes:
      - ./orgs/belastingdienst-mock/pki:/certs:ro
      # Same self-signed PDP cert the Inways trust as CA (see bd-inway).
      # Separate mount root to avoid a conflict with /certs (ro).
      - ../services/openftv-pdp/certs:/authzen-ca:ro
    environment:
      <<: *manager-env
      TLS_GROUP_CERT: /certs/org/bd-mock.pem
      TLS_GROUP_KEY: /certs/org/bd-mock-key.pem
      TLS_GROUP_TOKEN_CERT: /certs/org/bd-mock.pem
      TLS_GROUP_TOKEN_KEY: /certs/org/bd-mock-key.pem
      TLS_GROUP_CONTRACT_CERT: /certs/org/bd-mock.pem
      TLS_GROUP_CONTRACT_KEY: /certs/org/bd-mock-key.pem
      CONTROLLER_REGISTRATION_API_ADDRESS: https://bd-controller:9443
      TX_LOG_API_ADDRESS: https://bd-txlog-api:9443
      SELF_ADDRESS: "https://bd-manager:8443"
      STORAGE_POSTGRES_DSN: "postgresql://postgres:${FSC_POSTGRES_PASSWORD}@postgres:5432/fsc_bd_manager?sslmode=disable&connect_timeout=2"
    depends_on:
      postgres: {condition: service_healthy}
      bd-migrations-manager: {condition: service_completed_successfully}
      bd-txlog-api: {condition: service_started}

  bd-inway:
    <<: *inway
    # The sidecars behind this Inway are reachable on source-gateways only,
    # so that nothing but an Inway, after its PDP's allow, reaches them.
    networks:
      - default
      - source-gateways
    volumes:
      - ./orgs/belastingdienst-mock/pki:/certs:ro
      # The OpenFTV PDP self-signed cert serves as CA for the AuthZen
      # plugin (see AUTHZEN_ROOT_CA). Separate mount root to avoid a
      # conflict with /certs (ro).
      - ../services/openftv-pdp/certs:/authzen-ca:ro
    environment:
      <<: *inway-env
      TLS_GROUP_CERT: /certs/org/bd-mock.pem
      TLS_GROUP_KEY: /certs/org/bd-mock-key.pem
      NAME: BdInway-01
      SELF_ADDRESS: "https://bd-inway:443"
      CONTROLLER_REGISTRATION_API_ADDRESS: https://bd-controller:9443
      TX_LOG_API_ADDRESS: https://bd-txlog-api:9443
      MANAGER_INTERNAL_UNAUTHENTICATED_ADDRESS: https://bd-manager:9444
      # Every inbound request is AuthZen-checked by the OpenFTV PDP
      # before it reaches the backend service. FSC-Inway requires
      # HTTPS + CA; openftv-pdp gets a self-signed cert (via
      # generate-pdp-cert.sh), mounted as /authzen-ca/pdp-service.pem.
      AUTHZEN_SERVICE_ADDRESS: https://openftv-pdp:8443/authzen/v1
      AUTHZEN_ROOT_CA: /authzen-ca/pdp-service.pem
      AUTHZEN_WITH_BODY: "true"
    depends_on: [bd-controller, bd-manager, bd-txlog-api]

  bd-txlog-api:
    <<: *txlog-api
    volumes: [./orgs/belastingdienst-mock/pki:/certs:ro]
    environment:
      <<: *txlog-api-env
      STORAGE_POSTGRES_DSN: "postgresql://postgres:${FSC_POSTGRES_PASSWORD}@postgres:5432/fsc_bd_txlog?sslmode=disable&connect_timeout=2"
    depends_on:
      postgres: {condition: service_healthy}
      bd-migrations-txlog-api: {condition: service_completed_successfully}

  # === BRP/RvIG-mock (provider) =========================================

  brp-migrations-controller:
    <<: *controller-migrations
    volumes: [./orgs/brp-mock/pki:/certs:ro]
    environment:
      <<: *fsc-env
      POSTGRES_DSN: "postgresql://postgres:${FSC_POSTGRES_PASSWORD}@postgres:5432/fsc_brp_controller?sslmode=disable&connect_timeout=10"

  brp-migrations-manager:
    <<: *manager-migrations
    volumes: [./orgs/brp-mock/pki:/certs:ro]
    environment:
      <<: *fsc-env
      POSTGRES_DSN: "postgresql://postgres:${FSC_POSTGRES_PASSWORD}@postgres:5432/fsc_brp_manager?sslmode=disable&connect_timeout=10"

  brp-migrations-txlog-api:
    <<: *txlog-api-migrations
    volumes: [./orgs/brp-mock/pki:/certs:ro]
    environment:
      <<: *fsc-env
      POSTGRES_DSN: "postgresql://postgres:${FSC_POSTGRES_PASSWORD}@postgres:5432/fsc_brp_txlog?sslmode=disable&connect_timeout=10"

  brp-controller:
    <<: *controller
    ports:
      - "${GBO_PUBLIC_BIND_ADDRESS:+${GBO_PUBLIC_BIND_ADDRESS}:}${FSC_PORT_BRP_CONTROLLER:-8097}:3001"
    volumes: [./orgs/brp-mock/pki:/certs:ro]
    environment:
      <<: *controller-env
      MANAGER_ADDRESS_INTERNAL: https://brp-manager:9443
      STORAGE_POSTGRES_DSN: "postgresql://postgres:${FSC_POSTGRES_PASSWORD}@postgres:5432/fsc_brp_controller?sslmode=disable&connect_timeout=2"
    depends_on:
      postgres: {condition: service_healthy}
      brp-manager: {condition: service_started}
      brp-migrations-controller: {condition: service_completed_successfully}

  brp-manager:
    <<: *manager
    # Same policy-driven contract acceptance as bd-manager: the PDP
    # decides, the flag does not. See the comment there for why
    # --auto-sign-grants cannot be combined with a PDP address.
    command: *sign-by-pdp
    volumes:
      - ./orgs/brp-mock/pki:/certs:ro
      # Same self-signed PDP cert the Inways trust as CA (see brp-inway).
      # Separate mount root to avoid a conflict with /certs (ro).
      - ../services/openftv-pdp/certs:/authzen-ca:ro
    environment:
      <<: *manager-env
      TLS_GROUP_CERT: /certs/org/brp-mock.pem
      TLS_GROUP_KEY: /certs/org/brp-mock-key.pem
      TLS_GROUP_TOKEN_CERT: /certs/org/brp-mock.pem
      TLS_GROUP_TOKEN_KEY: /certs/org/brp-mock-key.pem
      TLS_GROUP_CONTRACT_CERT: /certs/org/brp-mock.pem
      TLS_GROUP_CONTRACT_KEY: /certs/org/brp-mock-key.pem
      CONTROLLER_REGISTRATION_API_ADDRESS: https://brp-controller:9443
      TX_LOG_API_ADDRESS: https://brp-txlog-api:9443
      SELF_ADDRESS: "https://brp-manager:8443"
      STORAGE_POSTGRES_DSN: "postgresql://postgres:${FSC_POSTGRES_PASSWORD}@postgres:5432/fsc_brp_manager?sslmode=disable&connect_timeout=2"
    depends_on:
      postgres: {condition: service_healthy}
      brp-migrations-manager: {condition: service_completed_successfully}
      brp-txlog-api: {condition: service_started}

  brp-inway:
    <<: *inway
    # The sidecars behind this Inway are reachable on source-gateways only,
    # so that nothing but an Inway, after its PDP's allow, reaches them.
    networks:
      - default
      - source-gateways
    volumes:
      - ./orgs/brp-mock/pki:/certs:ro
      - ../services/openftv-pdp/certs:/authzen-ca:ro
    environment:
      <<: *inway-env
      TLS_GROUP_CERT: /certs/org/brp-mock.pem
      TLS_GROUP_KEY: /certs/org/brp-mock-key.pem
      NAME: BrpInway-01
      SELF_ADDRESS: "https://brp-inway:443"
      CONTROLLER_REGISTRATION_API_ADDRESS: https://brp-controller:9443
      TX_LOG_API_ADDRESS: https://brp-txlog-api:9443
      MANAGER_INTERNAL_UNAUTHENTICATED_ADDRESS: https://brp-manager:9444
      AUTHZEN_SERVICE_ADDRESS: https://openftv-pdp:8443/authzen/v1
      AUTHZEN_ROOT_CA: /authzen-ca/pdp-service.pem
      AUTHZEN_WITH_BODY: "true"
    depends_on: [brp-controller, brp-manager, brp-txlog-api]

  brp-txlog-api:
    <<: *txlog-api
    volumes: [./orgs/brp-mock/pki:/certs:ro]
    environment:
