    volumes: [./orgs/gbo-pdp/pki:/certs:ro]
    environment:
      <<: *controller-env
      MANAGER_ADDRESS_INTERNAL: https://pdp-manager:9443
      STORAGE_POSTGRES_DSN: "postgresql://postgres:${FSC_POSTGRES_PASSWORD}@postgres:5432/fsc_pdp_controller?sslmode=disable&connect_timeout=2"
