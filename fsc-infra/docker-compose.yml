    volumes: [./orgs/gbo-pdp/pki:/certs:ro]
    environment:
      <<: *manager-env
      TLS_GROUP_CERT: /certs/org/gbo-pdp.pem
      TLS_GROUP_KEY: /certs/org/gbo-pdp-key.pem
      TLS_GROUP_TOKEN_CERT: /certs/org/gbo-pdp.pem
      TLS_GROUP_TOKEN_KEY: /certs/org/gbo-pdp-key.pem
      TLS_GROUP_CONTRACT_CERT: /certs/org/gbo-pdp.pem
      TLS_GROUP_CONTRACT_KEY: /certs/org/gbo-pdp-key.pem
      CONTROLLER_REGISTRATION_API_ADDRESS: https://pdp-controller:9443
      TX_LOG_API_ADDRESS: https://pdp-txlog-api:9443
      SELF_ADDRESS: "https://pdp-manager:8443"
      STORAGE_POSTGRES_DSN: "postgresql://postgres:${FSC_POSTGRES_PASSWORD}@postgres:5432/fsc_pdp_manager?sslmode=disable&connect_timeout=2"
