    <<: *manager
    profiles: [integrator]
    volumes: [./orgs/integrator/pki:/certs:ro]
    environment:
      <<: *manager-env
      TLS_GROUP_CERT: /certs/org/integrator.pem
      TLS_GROUP_KEY: /certs/org/integrator-key.pem
      TLS_GROUP_TOKEN_CERT: /certs/org/integrator.pem
      TLS_GROUP_TOKEN_KEY: /certs/org/integrator-key.pem
      TLS_GROUP_CONTRACT_CERT: /certs/org/integrator.pem
      TLS_GROUP_CONTRACT_KEY: /certs/org/integrator-key.pem
      CONTROLLER_REGISTRATION_API_ADDRESS: https://int-controller:9443
      TX_LOG_API_ADDRESS: https://int-txlog-api:9443
      SELF_ADDRESS: "https://int-manager:8443"
      STORAGE_POSTGRES_DSN: "postgresql://postgres:${FSC_POSTGRES_PASSWORD}@postgres:5432/fsc_int_manager?sslmode=disable&connect_timeout=2"
    depends_on:
      postgres: {condition: service_healthy}
      int-migrations-manager: {condition: service_completed_successfully}
      int-txlog-api: {condition: service_started}

  int-outway:
    <<: *outway
    profiles: [integrator]
    volumes: [./orgs/integrator/pki:/certs:ro]
    environment:
      <<: *outway-env
      TLS_GROUP_CERT: /certs/org/integrator.pem
      TLS_GROUP_KEY: /certs/org/integrator-key.pem
      NAME: IntOutway-01
      CONTROLLER_REGISTRATION_API_ADDRESS: https://int-controller:9443
      TX_LOG_API_ADDRESS: https://int-txlog-api:9443
      MANAGER_INTERNAL_ADDRESS: https://int-manager:9443
    depends_on: [int-controller, int-manager, int-txlog-api]

  int-txlog-api:
    <<: *txlog-api
    profiles: [integrator]
    volumes: [./orgs/integrator/pki:/certs:ro]
    environment:
      <<: *txlog-api-env
      STORAGE_POSTGRES_DSN: "postgresql://postgres:${FSC_POSTGRES_PASSWORD}@postgres:5432/fsc_int_txlog?sslmode=disable&connect_timeout=2"
    depends_on:
      postgres: {condition: service_healthy}
      int-migrations-txlog-api: {condition: service_completed_successfully}

  # ASIP (Peer ID ...1200): the Authentic Source Interface Provider of the
  # ETSI TS 119 478 route (services/asi-provider). It queries the BRP source
  # (service brp on ...0200) as its own consumer, not through the EDI issuer
  # peer, so the source's policy sees the ASIP as actor (rule ASI0001).
  # It has no service of its own, only an Outway.
  # Opt-in: profile "asi", started by `make demo-asi`.
  asip-migrations-controller:
    <<: *controller-migrations
    profiles: [asi]
    volumes: [./orgs/asip/pki:/certs:ro]
    environment:
      <<: *fsc-env
      POSTGRES_DSN: "postgresql://postgres:${FSC_POSTGRES_PASSWORD}@postgres:5432/fsc_asip_controller?sslmode=disable&connect_timeout=10"

  asip-migrations-manager:
    <<: *manager-migrations
    profiles: [asi]
    volumes: [./orgs/asip/pki:/certs:ro]
    environment:
      <<: *fsc-env
      POSTGRES_DSN: "postgresql://postgres:${FSC_POSTGRES_PASSWORD}@postgres:5432/fsc_asip_manager?sslmode=disable&connect_timeout=10"

  asip-migrations-txlog-api:
    <<: *txlog-api-migrations
    profiles: [asi]
    volumes: [./orgs/asip/pki:/certs:ro]
    environment:
      <<: *fsc-env
      POSTGRES_DSN: "postgresql://postgres:${FSC_POSTGRES_PASSWORD}@postgres:5432/fsc_asip_txlog?sslmode=disable&connect_timeout=10"

  asip-controller:
    <<: *controller
    profiles: [asi]
    ports:
      - "${GBO_PUBLIC_BIND_ADDRESS:+${GBO_PUBLIC_BIND_ADDRESS}:}${FSC_PORT_ASIP_CONTROLLER:-8102}:3001"
    volumes: [./orgs/asip/pki:/certs:ro]
    environment:
      <<: *controller-env
      MANAGER_ADDRESS_INTERNAL: https://asip-manager:9443
      STORAGE_POSTGRES_DSN: "postgresql://postgres:${FSC_POSTGRES_PASSWORD}@postgres:5432/fsc_asip_controller?sslmode=disable&connect_timeout=2"
    depends_on:
      postgres: {condition: service_healthy}
      asip-manager: {condition: service_started}
      asip-migrations-controller: {condition: service_completed_successfully}

  asip-manager:
    <<: *manager
    profiles: [asi]
    volumes: [./orgs/asip/pki:/certs:ro]
    environment:
      <<: *manager-env
      TLS_GROUP_CERT: /certs/org/asip.pem
      TLS_GROUP_KEY: /certs/org/asip-key.pem
      TLS_GROUP_TOKEN_CERT: /certs/org/asip.pem
      TLS_GROUP_TOKEN_KEY: /certs/org/asip-key.pem
      TLS_GROUP_CONTRACT_CERT: /certs/org/asip.pem
      TLS_GROUP_CONTRACT_KEY: /certs/org/asip-key.pem
      CONTROLLER_REGISTRATION_API_ADDRESS: https://asip-controller:9443
      TX_LOG_API_ADDRESS: https://asip-txlog-api:9443
      SELF_ADDRESS: "https://asip-manager:8443"
      STORAGE_POSTGRES_DSN: "postgresql://postgres:${FSC_POSTGRES_PASSWORD}@postgres:5432/fsc_asip_manager?sslmode=disable&connect_timeout=2"
    depends_on:
      postgres: {condition: service_healthy}
      asip-migrations-manager: {condition: service_completed_successfully}
      asip-txlog-api: {condition: service_started}

  asip-outway:
    <<: *outway
    profiles: [asi]
    volumes: [./orgs/asip/pki:/certs:ro]
    environment:
      <<: *outway-env
      TLS_GROUP_CERT: /certs/org/asip.pem
      TLS_GROUP_KEY: /certs/org/asip-key.pem
      NAME: AsipOutway-01
      CONTROLLER_REGISTRATION_API_ADDRESS: https://asip-controller:9443
      TX_LOG_API_ADDRESS: https://asip-txlog-api:9443
      MANAGER_INTERNAL_ADDRESS: https://asip-manager:9443
    depends_on: [asip-controller, asip-manager, asip-txlog-api]

  asip-txlog-api:
    <<: *txlog-api
    profiles: [asi]
    volumes: [./orgs/asip/pki:/certs:ro]
    environment:
      <<: *txlog-api-env
      STORAGE_POSTGRES_DSN: "postgresql://postgres:${FSC_POSTGRES_PASSWORD}@postgres:5432/fsc_asip_txlog?sslmode=disable&connect_timeout=2"
    depends_on:
      postgres: {condition: service_healthy}
      asip-migrations-txlog-api: {condition: service_completed_successfully}

volumes:
  postgres-data:

networks:
  # Shared with the main stack's sidecars (see source-gateways there). Only the
  # Inways that publish a source join it.
  source-gateways:
    name: ${FSC_PROJECT_NAME:-fsc-infra}_source-gateways
