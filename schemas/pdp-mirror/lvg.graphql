# Clean (directive-free) SDL for the LVG bron (Landelijke Voorziening
# Gebouwen) of the LVG/Installatie Register pilot. The PDP uses this as a
# structural reference to bind queried fields to rules; it is NOT policy —
# the binding lives in the rules themselves (covers_fields in LVG0001).
#
# Mirrors lvg-graphql-server/main.go buildSchema().
# CI checks that every element here has the same definition in the running
# source (scripts/check-schema-drift.sh); the source may have more. A change
# to the source schema that touches this file fails until both agree.
# Type names must not collide with the other sources: rules bind on
# Type.field keys, which are not scoped per service.

scalar BSN

type Query {
  "Het verblijfsobject als de burger er eigenaar van is, anders null."
  vbo(bsn: BSN!, vboId: String!): Verblijfsobject
}

type Verblijfsobject {
  vboId: String!
}
