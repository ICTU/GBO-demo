# Static trust host of the own credential issuer: what a wallet fetches to
# check a source's access and registration certificates. The files come from
# make provision-wallet-registration (EUDI_TRUST_PUBLISH_DIR); the pages are
# the registry, support and policy addresses a registration certificate
# names.
server {
    listen 8080;
    server_tokens off;
    root /usr/share/trust;

    # The entire generation is activated by replacing the lote symlink.
    # Match the EU reference host's observed media type. Never expose the
    # internal manifest or generation directories through the fallback route.
    location ~ ^/lote/(PID|PubEAA|WRPAC|WRPRC)Providers\.jwt$ {
        types { }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=3600";
        etag off;
        if_modified_since off;
        try_files $uri =404;
    }

    location = /reader-root.crl {
        default_type application/pkix-crl;
        add_header Cache-Control "no-cache";
    }

    location /wrprc/ {
        default_type application/statuslist+jwt;
        add_header Cache-Control "no-cache";
    }

    location ~ ^/(registry|support|certificate-policy)$ {
        root /usr/share/trust-pages;
        default_type text/html;
        try_files /$1.html =404;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
