server {
    listen 80;
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
    location = /eudi-offers.json {
        proxy_pass http://eudi-adapter:4009/eudi-offers.json;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
    }
    # The page is static; the Helm chart's default probe path still needs
    # an answer.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
