server {
    listen 80;
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
    # Generated at container startup. Without EUDI_API_TARGET this returns
    # 503, so the static landing page can run without an adapter Service.
    include /etc/nginx/eudi-offers-location.conf;
    # The page is static; the Helm chart's default probe path still needs
    # an answer.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
