services:
  # --- Infrastructure ---
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    ports:
      - "${GBO_PORT_OTEL_GRPC:-9317}:4317"   # gRPC
      - "${GBO_PORT_OTEL_HTTP:-9318}:4318"   # HTTP
    volumes:
      - ./otel/collector-config.yaml:/etc/otelcol-contrib/config.yaml
    networks:
      - backend

  jaeger:
    image: jaegertracing/all-in-one:1.54
    ports:
      - "${GBO_PORT_JAEGER:-9686}:16686"  # Jaeger UI + Query API
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:16686/"]
      interval: 5s
      timeout: 3s
      retries: 5

  loki:
    image: grafana/loki:2.9.6
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "${GBO_PORT_LOKI:-9310}:3100"
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/local-config.yaml:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3100/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  promtail:
    image: grafana/promtail:2.9.6
    command: -config.file=/etc/promtail/config.yaml -config.expand-env=true
    environment:
      # The promtail config filters docker_sd on this label; compose sets
      # COMPOSE_PROJECT_NAME from the directory (or -p), so worktrees get
      # the right value automatically.
      - COMPOSE_PROJECT_NAME
    volumes:
      - ./observability/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - backend
    depends_on:
      loki:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "${GBO_PORT_GRAFANA:-9300}:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Editor
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_USERS_DEFAULT_THEME=light
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - backend
    depends_on:
      loki:
        condition: service_healthy
      jaeger:
        condition: service_healthy

  # OpenFTV PDP with the embedded OPA/Rego engine — the authorization
  # endpoint for FSC-Inway (AuthZEN, HTTPS on :8443). The GraphQL
  # context-handler runs INSIDE this image as a request-mapper
  # (services/openftv-pdp/mapper, PDP_REQUEST_MAPPINGS); it verifies the
  # signed consent context and checks its live status at the consent-register.
  # Note: PDP_POLICIES_LANGUAGE must be "rego" — the documented value
  # "OPA" makes OpenFTV silently skip all policy files (upstream quirk).
  openftv-pdp:
    # Build context is the repo root: the Dockerfile bakes ./policies in.
    build:
      context: .
      dockerfile: services/openftv-pdp/Dockerfile
    environment:
      - PDP_POLICIES_LANGUAGE=rego
      - PDP_POLICIES_STORE=/policies
      - PDP_POLICIES_STORE_RECURSE=true
      # The Authorization Decision Log. stdout by default; the manager
      # profile points it at Postgres so the management interface's Logboek
      # has something to read — its routes are only registered when the ADL
      # is Postgres-backed, so without this the page 404s.
      # NB: this is OpenFTV's ADL, not the embedded OPA console decision log
      # the dev-portal reads from Loki. Those are independent.
      - PDP_ADL_TYPE=${GBO_ADL_TYPE:-stdout}
      - PDP_ADL_PG_URL=${GBO_ADL_PG_URL:-}
      - PDP_MIGRATE_SOURCE=${GBO_ADL_MIGRATE_SOURCE:-}
      - PDP_MIGRATE_AUTO=${GBO_ADL_MIGRATE_AUTO:-false}
      - PDP_ADL_SERVICE_NAME=gbo
      - PDP_LOG_LEVEL=info
      - PDP_REQUEST_MAPPINGS=graphqltocontext
      # The mapper fetches verification keys and the referenced consent's
      # current status per request. Any verification/status failure denies.
      - GBO_CONSENT_URL=http://consent-register:4002
      - GBO_CONSENT_ISSUER=https://consent-register.gbo.test
      - GBO_CONSENT_AUDIENCE=gbo:dvtp:pdp
      # The EUDI flow resolves the wallet-disclosed BSN to a PI here; the
      # policy engine (and its decision log) is never given the BSN.
      - GBO_BSNK_URL=http://bsnk-mock:4003
      # Empty by default: the PDP then loads policies from /policies and
      # skips bundle retrieval entirely (apps/pdp/server/router.go). Set it
      # — `make demo-manager` does — to put the OpenFTV Manager in charge
      # of policy distribution instead.
      - PDP_BUNDLE_MANAGER=${GBO_BUNDLE_MANAGER:-}
      # TLS for the FSC-Inway AuthZen plugin (requires HTTPS + CA).
      - PDP_TLS_CERT=/certs/pdp-service.pem
      - PDP_TLS_KEY=/certs/pdp-service-key.pem
    ports:
      - "${GBO_PORT_OPA:-9181}:8443"
      - "${GBO_PORT_OPA_HEALTH:-9180}:8080"
    volumes:
      - ./policies:/policies:ro
      - ./services/openftv-pdp/certs:/certs:ro
    networks:
      - backend
      # The bd-Inway AuthZen plugin calls openftv-pdp directly; must be
      # reachable inside fsc-infra_default.
      - fsc-infra
    depends_on:
      consent-register:
        condition: service_healthy
      bsnk-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- OpenFTV management plane (profile: manager) --------------------------
  # The PAP+PIP half of OpenFTV. It owns the policies, bundles them, and
  # ships them to every PDP named in services/openftv-manager/bundles/.
  # This is what lets a source-holder manage its own policy without
  # rebuilding a PDP image — the point of running a federated PDP at all.
  #
  # Opt-in, because it changes where policy comes from: without it the PDP
  # loads ./policies from disk and hot-reloads on edit, which is the nicer
  # loop while writing Rego. Start it with `make demo-manager`.
  postgres-ftv:
    image: postgres:16-alpine
    profiles: [manager]
    environment:
      POSTGRES_PASSWORD: ${FTV_POSTGRES_PASSWORD}
      POSTGRES_USER: ftv
      POSTGRES_DB: ftv_manager
    volumes:
      - postgres-ftv-data:/var/lib/postgresql/data
      # Runs only on an empty data directory (compose down -v to re-run).
      - ./services/openftv-manager/initdb:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ftv -d ftv_manager"]
      interval: 5s
      timeout: 3s
      retries: 10

  openftv-manager:
    profiles: [manager]
    build:
      context: .
      dockerfile: services/openftv-manager/Dockerfile
    environment:
      # Managed policies live in Postgres — the Manager's PAP is built
      # without a file store (apps/manager/server/pap.go), so there is no
      # directory to point it at. scripts/seed-openftv-manager.py pushes
      # ./policies in over the API, which is the same path the management
      # interface uses.
      - MANAGER_PERSIST_TYPE=postgres
      - MANAGER_PERSIST_POSTGRES_URL=postgres://ftv:${FTV_POSTGRES_PASSWORD}@postgres-ftv:5432/ftv_manager?sslmode=disable
      - MANAGER_MIGRATE_SOURCE=*EMBED*
      - MANAGER_MIGRATE_AUTO=true
      # Deliberately NOT set to rego. MANAGER_POLICIES_LANGUAGE selects the
      # language of the policies that authorize the Manager's OWN API (it
      # seeds Cedar ones for that), and those share a store with the
      # policies it manages. Setting it to rego makes our `package authz`
      # — the GBO decision entrypoint — govern the Manager's API instead,
      # which is undefined for that input shape: every request then 403s.
      # It survives the first boot, because the store is still empty when
      # the authorizer initialises, and breaks on the next restart.
      # The language of a managed policy comes from the policy itself, and
      # the bundle filters on the language in its own config.
      # These Cedar policies authorize the Manager's own API. Fail closed
      # if they cannot be loaded: an empty store must never mean open access.
      - MANAGER_POLICIES_STORE=/authz
      - MANAGER_POLICIES_STORE_RECURSE=true
      - MANAGER_AUTHORIZATION_AUTHENTICATE=true
      - MANAGER_AUTHORIZATION_FAIL_CLOSED_ON_EMPTY=true
      - MANAGER_TAGS_PATH=/tags
      - MANAGER_BUNDLE_CONFIGS=/bundles
      - MANAGER_INTERNAL_PORT=9443
      - MANAGER_LOG_LEVEL=info
      # Validate the management interface's tokens. The issuer must be the
      # URL the BROWSER used, since that is what Keycloak puts in the token;
      # the JWKS is fetched server-side over the compose network.
      - MANAGER_OIDC_ISSUER=${GBO_FTV_OIDC_AUTHORITY:-http://localhost:9284/realms/gbo}
      - MANAGER_OIDC_JWKS_URL=http://keycloak:8080/realms/gbo/protocol/openid-connect/certs
      - MANAGER_OIDC_AUDIENCE=openftv-manager-api
      - MANAGER_OIDC_ROLES_CLAIM=roles
      # Serves the Logboek in the management interface. initADL only
      # registers its routes for a Postgres-backed decision log — any other
      # value and the endpoints simply do not exist.
      - MANAGER_ADL_TYPE=postgres
      - MANAGER_ADL_PG_URL=postgres://ftv:${FTV_POSTGRES_PASSWORD}@postgres-ftv:5432/ftv_adl?sslmode=disable
    ports:
      # Management API (what the seed script and a UI talk to).
      - "${GBO_PORT_FTV_MANAGER:-9280}:8443"
      # Internal API: where the PDP pulls its bundle from.
      - "${GBO_PORT_FTV_MANAGER_INTERNAL:-9281}:9443"
      - "${GBO_PORT_FTV_MANAGER_HEALTH:-9282}:8080"
    networks: [backend]
    depends_on:
      postgres-ftv:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The Manager's own UI: browse and edit policies, attributes and
  # deployments. It authenticates against Keycloak, because it reads its
  # capabilities from a top-level `roles` claim in the access token — admin
  # publishes, author writes, anything else is read-only.
  #
  # The URLs below are consumed by the BROWSER, so they must be reachable
  # from wherever you open the page — not from inside the compose network —
  # and over HTTPS unless that is localhost (see the PKCE note further down).
  openftv-manager-ui:
    profiles: [manager]
    build:
      context: .
      dockerfile: services/openftv-manager-ui/Dockerfile
    environment:
      # Set as whole URLs rather than host+port, so the stack can sit behind
      # a TLS reverse proxy on separate hostnames. That is not optional for
      # a remote demo: the UI's OIDC login uses PKCE, PKCE needs
      # Crypto.subtle, and browsers only expose that in a secure context —
      # so http://<lan-ip>:9283 fails with "Crypto.subtle is available only
      # in secure contexts". localhost counts as secure; a LAN IP does not.
      - VITE_PAP_BASE_URL=${GBO_FTV_MANAGER_URL:-http://localhost:9280}
      - VITE_PIP_BASE_URL=${GBO_FTV_MANAGER_URL:-http://localhost:9280}
      - VITE_OIDC_AUTHORITY=${GBO_FTV_OIDC_AUTHORITY:-http://localhost:9284/realms/gbo}
      - VITE_OIDC_CLIENT_ID=openftv-manager-ui
    ports:
      - "${GBO_PORT_FTV_MANAGER_UI:-9283}:8080"
    networks: [backend]
    depends_on:
      openftv-manager:
        condition: service_healthy

  # Demo IdP for the management interface. Public visitors use the read-only
  # auditor account. A secret-backed deployment identity is the only account
  # that can write and publish policies.
  keycloak:
    profiles: [manager]
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-}
      - FTV_MANAGER_AUDITOR_PASSWORD=${FTV_MANAGER_AUDITOR_PASSWORD:-}
      - FTV_MANAGER_DEPLOY_PASSWORD=${FTV_MANAGER_DEPLOY_PASSWORD:-}
      # The issuer in the token must match what the browser used to reach
      # Keycloak, or the SPA rejects it. start-dev derives it per request.
      - KC_HOSTNAME_STRICT=false
      - KC_HTTP_ENABLED=true
      # Behind a TLS-terminating proxy the login form would otherwise post
      # to http:// from an https:// page, which the browser blocks as
      # "Form is not secure". Honour the forwarded scheme instead.
      - KC_PROXY_HEADERS=xforwarded
    volumes:
      - ./services/openftv-manager-ui/keycloak/realm-gbo.json:/opt/keycloak/data/import/realm-gbo.json:ro
    ports:
      - "${GBO_PORT_KEYCLOAK:-9284}:8080"
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /realms/gbo HTTP/1.1\\nHost: localhost\\nConnection: close\\n\\n' >&3 && cat <&3 | head -1 | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  # --- Go Backend Services ---
  sector-pip:
    build: ./services/sector-pip
    ports:
      - "${GBO_PORT_SECTOR_PIP:-9404}:4004"
    environment:
      - OTEL_SERVICE_NAME=sector-pip
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
    volumes:
      - ./services/sector-pip/config:/config:ro
    networks:
      - backend
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4004/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  graphql-server:
    build: ./services/graphql-server
    ports:
      - "${GBO_PORT_GRAPHQL:-9400}:4000"
    environment:
      - OTEL_SERVICE_NAME=graphql-server
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - GBO_SOURCE_METADATA_PATH=/config/gbo-source-metadata.json
    volumes:
      - ./services/graphql-server/config:/config:ro
    networks:
      - backend
      # bd-Inway forwards bri requests to graphql-server; must therefore
      # be reachable inside fsc-infra_default.
      - fsc-infra
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Second bron: bronprofiel BRP (persoonsgegevens). Locally it is published
  # by its own BRP/RvIG FSC peer (OIN ...0400), separate from BD (OIN ...0200).
  brp-graphql-server:
    build: ./services/brp-graphql-server
    ports:
      - "${GBO_PORT_BRP_GRAPHQL:-9401}:4001"
    environment:
      - OTEL_SERVICE_NAME=brp-graphql-server
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - GBO_SOURCE_METADATA_PATH=/config/gbo-source-metadata.json
    volumes:
      - ./services/brp-graphql-server/config:/config:ro
    networks:
      - backend
      - fsc-infra
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4001/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  consent-register:
    build: ./services/consent-register
    ports:
      - "${GBO_PORT_CONSENT_REGISTER:-9402}:4002"
    environment:
      - OTEL_SERVICE_NAME=consent-register
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - CONSENT_TOKEN_ISSUER=https://consent-register.gbo.test
      - CONSENT_TOKEN_AUDIENCE=gbo:dvtp:pdp
    networks:
      - backend
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4002/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  bsnk-mock:
    build: ./services/bsnk-mock
    ports:
      - "${GBO_PORT_BSNK:-9403}:4003"
    environment:
      - OTEL_SERVICE_NAME=bsnk-mock
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
    networks:
      - backend
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4003/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Provider-owned OpenFSC Additional Claims API. Maps validated connection
  # grants to flow and identifier semantics; the provider Manager signs the
  # returned values into the access-token's official `add` claim.
  additional-claims-service:
    build: ./services/additional-claims-service
    ports:
      - "${GBO_PORT_ADDITIONAL_CLAIMS:-9412}:4012"
    environment:
      - CLAIMS_CONFIG_PATH=/config/claims.json
    volumes:
      - ./services/additional-claims-service/config/local-claims.json:/config/claims.json:ro
    networks:
      - backend
      - fsc-infra

  # Gateway next to the source. Reads additional claim subject_id_type
  # from the FSC token; substitutes PI variables to BSN via bsnk-mock
  # for 'pseudonym' contracts; pass-through for 'direct' contracts
  # (current EUDI flow). Runs in fsc-infra_default so bd-inway can
  # reach it; reaches graphql-server over the main stack backend
  # network.
  bron-sidecar:
    build: ./services/bron-sidecar
    ports:
      - "${GBO_PORT_BRON_SIDECAR:-9411}:4011"
    environment:
      - OTEL_SERVICE_NAME=bron-sidecar
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - UPSTREAM_URL=http://graphql-server:4000
      - BSNK_URL=http://bsnk-mock:4003
      - OWN_PEER_OIN=99999999900000000200
      - PSEUDONYM_VARS=bsn
    networks:
      - backend
      - fsc-infra
    depends_on:
      graphql-server:
        condition: service_healthy
      bsnk-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4011/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Same sidecar image in front of the BRP bron. The sidecar is bron-agnostic
  # (UPSTREAM_URL + PSEUDONYM_VARS), so a second bron needs a second instance,
  # not a second implementation. The BRP service is EUDI-only for now
  # (subject_id_type=direct), so in practice this is pass-through; it stays in
  # place so a DvTP consumer with a pseudonym contract can be added later
  # without moving the FSC service endpoint.
  brp-sidecar:
    build: ./services/bron-sidecar
    ports:
      - "${GBO_PORT_BRP_SIDECAR:-9413}:4011"
    environment:
      - OTEL_SERVICE_NAME=brp-sidecar
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - UPSTREAM_URL=http://brp-graphql-server:4001
      - BSNK_URL=http://bsnk-mock:4003
      - OWN_PEER_OIN=99999999900000000400
      - PSEUDONYM_VARS=bsn
    networks:
      - backend
      - fsc-infra
    depends_on:
      brp-graphql-server:
        condition: service_healthy
      bsnk-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4011/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  consent-portal-backend:
    build: ./services/consent-portal-backend
    profiles: [dvtp, full]
    ports:
      - "${GBO_PORT_CONSENT_PORTAL_BACKEND:-9405}:4005"
    environment:
      - OTEL_SERVICE_NAME=consent-portal-backend
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - BSNK_URL=http://bsnk-mock:4003
      - CONSENT_URL=http://consent-register:4002
      - DEV_PORTAL_BACKEND_URL=http://dev-portal-backend:4007
    networks:
      - backend
    depends_on:
      bsnk-mock:
        condition: service_healthy
      consent-register:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4005/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  dienstverlener-backend:
    build: ./services/dienstverlener-backend
    profiles: [dvtp, full]
    ports:
      - "${GBO_PORT_DV_BACKEND:-9406}:4006"
    environment:
      - OTEL_SERVICE_NAME=dienstverlener-backend
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      # Talks to the real FSC-Outway (Hypotheekverlener-mock) instead
      # of fsc-mock. OutwayPath = grant-link /bri + backend-path /graphql.
      # The signed consent token supplies the PI and scopes; the PDP verifies
      # it and checks revocation at S01.
      - OUTWAY_URL=http://hv-outway:8080
      - OUTWAY_PATH=/bri/graphql
      - ORG_OIN=99999999900000000300
      - ORG_SECTOR=hypotheekverlener
      - DEV_PORTAL_BACKEND_URL=http://dev-portal-backend:4007
    networks:
      - backend
      - fsc-infra
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4006/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Frontends run as a Vite dev-server (live reload / HMR via source-mount).
  # The Dockerfile has an nginx final stage available — for a production
  # build (`target: final`), build it manually with `docker build`.

  # Publieke voorpagina van de demo: legt uit wat GBO is en linkt door
  # naar de drie frontends. Heeft geen eigen backend — alle links wijzen
  # naar andere services en komen als VITE_* binnen (in het nginx-image
  # via runtime-config.js.template).
  landing-page:
    build:
      context: ./landing-page
      target: build
    command: npm run dev -- --host 0.0.0.0 --port 9000
    environment:
      - CHOKIDAR_USEPOLLING=true
      # Browser-side URL's, dus ze moeten de gepubliceerde host-poorten
      # volgen — niet de compose-interne poorten. En de host waar de
      # bezoeker vandaan kijkt, niet die van de server: zet
      # GBO_PUBLIC_HOST op het LAN-adres zodra je vanaf een andere machine
      # demonstreert, anders wijst de landingspagina naar de localhost van
      # de bezoeker.
      - VITE_DIENSTVERLENER_URL=${DIENSTVERLENER_PUBLIC_URL:-http://${GBO_PUBLIC_HOST:-localhost}:${GBO_PORT_DV_MOCK:-9001}}
      - VITE_TOESTEMMINGSPORTAAL_URL=${TOESTEMMINGSPORTAAL_PUBLIC_URL:-http://${GBO_PUBLIC_HOST:-localhost}:${GBO_PORT_TOESTEMMINGSPORTAAL:-9002}}
      - VITE_DEVELOPER_PORTAL_URL=${DEVELOPER_PORTAL_PUBLIC_URL:-http://${GBO_PUBLIC_HOST:-localhost}:${GBO_PORT_DEVELOPER_PORTAL:-9003}}
      # De wallet-QR wordt client-side samengesteld, net als in de
      # dev-portal. Zonder EUDI_PUBLIC_URL (de wallet op een telefoon moet
      # de issuance-server publiek kunnen bereiken) valt de QR weg en legt
      # de pagina uit waarom.
      - VITE_EUDI_PUBLIC_URL=${EUDI_PUBLIC_URL:-}
      - VITE_EUDI_UL_BASE=${EUDI_UL_BASE:-https://app.preproductie.wallet.edi.bzk.nl/deeplink/disclosure_based_issuance}
      - VITE_JAEGER_PUBLIC_URL=${JAEGER_PUBLIC_URL:-http://${GBO_PUBLIC_HOST:-localhost}:${GBO_PORT_JAEGER:-9686}}
      - VITE_GRAFANA_PUBLIC_URL=${GRAFANA_PUBLIC_URL:-http://${GBO_PUBLIC_HOST:-localhost}:${GBO_PORT_GRAFANA:-9300}}
      # De FSC-controllers draaien in de fsc-infra-stack, met eigen
      # FSC_PORT_*-poorten; vandaar losse overrides in plaats van GBO_PORT_*.
      - VITE_FSC_CONTROLLER_BRON_URL=${FSC_CONTROLLER_BRON_URL:-http://${GBO_PUBLIC_HOST:-localhost}:8092}
      - VITE_FSC_CONTROLLER_DVTP_URL=${FSC_CONTROLLER_DVTP_URL:-http://${GBO_PUBLIC_HOST:-localhost}:8096}
      - VITE_FSC_CONTROLLER_EUDI_URL=${FSC_CONTROLLER_EUDI_URL:-http://${GBO_PUBLIC_HOST:-localhost}:8094}
      - VITE_VERSION_STRING=${VERSION_STRING:-}
    volumes:
      - ./landing-page/src:/app/src
      - ./landing-page/public:/app/public
      - ./landing-page/index.html:/app/index.html
      - ./landing-page/vite.config.ts:/app/vite.config.ts
      - ./landing-page/tsconfig.json:/app/tsconfig.json
    ports:
      - "${GBO_PORT_LANDING:-9000}:9000"
    networks:
      - frontend

  dienstverlener-mock:
    build:
      context: ./dienstverlener-mock
      target: build
    profiles: [dvtp, full]
    command: npm run dev -- --host 0.0.0.0 --port 9001
    environment:
      - CHOKIDAR_USEPOLLING=true
      - DV_API_TARGET=http://dienstverlener-backend:4006
    volumes:
      - ./dienstverlener-mock/src:/app/src
      - ./dienstverlener-mock/public:/app/public
      - ./dienstverlener-mock/index.html:/app/index.html
      - ./dienstverlener-mock/vite.config.ts:/app/vite.config.ts
      - ./dienstverlener-mock/tsconfig.json:/app/tsconfig.json
    ports:
      - "${GBO_PORT_DV_MOCK:-9001}:9001"
    networks:
      - frontend
      - backend
    depends_on:
      dienstverlener-backend:
        condition: service_healthy

  toestemmingsportaal-frontend:
    build:
      context: ./toestemmingsportaal-frontend
      target: build
    profiles: [dvtp, full]
    command: npm run dev -- --host 0.0.0.0 --port 9002
    environment:
      - CHOKIDAR_USEPOLLING=true
      - PORTAL_API_TARGET=http://consent-portal-backend:4005
    volumes:
      - ./toestemmingsportaal-frontend/src:/app/src
      - ./toestemmingsportaal-frontend/public:/app/public
      - ./toestemmingsportaal-frontend/index.html:/app/index.html
      - ./toestemmingsportaal-frontend/vite.config.ts:/app/vite.config.ts
      - ./toestemmingsportaal-frontend/tsconfig.json:/app/tsconfig.json
    ports:
      - "${GBO_PORT_TOESTEMMINGSPORTAAL:-9002}:9002"
    networks:
      - frontend
      - backend
    depends_on:
      consent-portal-backend:
        condition: service_healthy

  dev-portal-backend:
    build:
      context: .
      dockerfile: services/dev-portal-backend/Dockerfile
    ports:
      - "${GBO_PORT_DEV_PORTAL_BACKEND:-9407}:4007"
    environment:
      - OTEL_SERVICE_NAME=dev-portal-backend
      - CITIZENS_FILE=/citizens/citizens.json
      - ORGANIZATIONS_FILE=/orgs/organizations.json
      # FSC-txlog access (demo shortcut). Production would use the
      # peer-facing manager /v1/logs with a peer-cert (Logius
      # fsc-logging draft). For the demo we mount each org's existing
      # internal-cert and talk to the txlog-api directly.
      - FSC_TXLOG_EDI_URL=https://edi-txlog-api:9443
      - FSC_TXLOG_EDI_CERT=/certs/edi/internal-cert.pem
      - FSC_TXLOG_EDI_KEY=/certs/edi/internal-cert-key.pem
      - FSC_TXLOG_EDI_CA=/certs/edi/intermediate_ca.pem
      - FSC_TXLOG_HV_URL=https://hv-txlog-api:9443
      - FSC_TXLOG_HV_CERT=/certs/hv/internal-cert.pem
      - FSC_TXLOG_HV_KEY=/certs/hv/internal-cert-key.pem
      - FSC_TXLOG_HV_CA=/certs/hv/intermediate_ca.pem
      - FSC_TXLOG_BD_URL=https://bd-txlog-api:9443
      - FSC_TXLOG_BD_CERT=/certs/bd/internal-cert.pem
      - FSC_TXLOG_BD_KEY=/certs/bd/internal-cert-key.pem
      - FSC_TXLOG_BD_CA=/certs/bd/intermediate_ca.pem
      - FSC_GROUP_ID=fsc-demo
      # Policy introspection for /policy-* endpoints reads the Rego
      # sources from disk (OpenFTV PDP has no /v1/policies); /rules
      # serves the pre-generated rules.json (scripts/gen-rules-json.sh).
      # Both are baked into the image; these compose bind mounts keep local
      # policy edits visible without rebuilding it.
      - POLICIES_DIR=/policies
      - RULES_FILE=/rules.json
    volumes:
      - dev-portal-var:/var
      - ./services/graphql-server/mockdata:/citizens:ro
      - ./services/sector-pip/config:/orgs:ro
      - ./policies:/policies:ro
      - ./services/dev-portal-backend/rules.json:/rules.json:ro
      - ./fsc-infra/orgs/edi-issuer/pki/internal:/certs/edi:ro
      - ./fsc-infra/orgs/hypotheekverlener-mock/pki/internal:/certs/hv:ro
      - ./fsc-infra/orgs/belastingdienst-mock/pki/internal:/certs/bd:ro
    networks:
      - backend
      # Join fsc-infra_default so {edi,bd,hv}-txlog-api:9443 can be
      # reached directly over their internal DNS names.
      - fsc-infra
    depends_on:
      # /decision + /explain read the engine's decision log via Loki —
      # cold-start without this dependency causes brief 502s until the
      # engine's healthcheck flips.
      openftv-pdp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4007/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  developer-portal:
    build:
      context: ./developer-portal
      target: build
    command: npm run dev -- --host 0.0.0.0 --port 9003
    environment:
      - CHOKIDAR_USEPOLLING=true
      - DEV_API_TARGET=http://dev-portal-backend:4007
      - PORTAL_API_TARGET=http://consent-portal-backend:4005
      - DVTP_API_TARGET=http://dienstverlener-backend:4006
      - JAEGER_API_TARGET=http://jaeger:16686
      # Bron-GraphQL behind the portal's own origin: the playground on
      # /playground queries /bron-api/<bron>/graphql, which the dev-server
      # (and nginx in the image) proxies here. Server-side targets, so these
      # are compose-internal names and ports, not published ones.
      - BD_GRAPHQL_TARGET=http://graphql-server:4000
      - BRP_GRAPHQL_TARGET=http://brp-graphql-server:4001
      - VITE_JAEGER_PUBLIC_URL=${JAEGER_PUBLIC_URL:-http://${GBO_PUBLIC_HOST:-localhost}:${GBO_PORT_JAEGER:-9686}}
      - VITE_GRAFANA_PUBLIC_URL=${GRAFANA_PUBLIC_URL:-http://${GBO_PUBLIC_HOST:-localhost}:${GBO_PORT_GRAFANA:-9300}}
      - EUDI_API_TARGET=http://eudi-adapter:4009
      # The EUDI QR is built client-side; these env vars drive the universal-link.
      # VITE_* is public — ends up in the built bundle (no secrets here).
      - VITE_EUDI_PUBLIC_URL=${EUDI_PUBLIC_URL:-}
      - VITE_EUDI_UL_BASE=${EUDI_UL_BASE:-https://app.preproductie.wallet.edi.bzk.nl/deeplink/disclosure_based_issuance}
    volumes:
      - ./developer-portal/src:/app/src
      - ./developer-portal/index.html:/app/index.html
      - ./developer-portal/vite.config.ts:/app/vite.config.ts
      - ./developer-portal/tsconfig.json:/app/tsconfig.json
    ports:
      - "${GBO_PORT_DEVELOPER_PORTAL:-9003}:9003"
    networks:
      - frontend
      - backend
    depends_on:
      dev-portal-backend:
        condition: service_healthy
      # consent-portal-backend and dienstverlener-backend live in the
      # dvtp profile and are not always on. The frontend polls at
      # runtime and shows an empty state on the relevant tab — no
      # build-time block needed.
      consent-portal-backend:
        condition: service_healthy
        required: false
      dienstverlener-backend:
        condition: service_healthy
        required: false

  # ══════════════════════════════════════════════════════════════════════
  # EUDI wallet stack — profile: eudi, default OFF
  # ══════════════════════════════════════════════════════════════════════
  # `docker compose --profile eudi up -d` brings up the EUDI stack:
  # postgres-eudi -> eudi-migrations (one-shot) -> eudi-issuance-server +
  # eudi-adapter.
  # The adapter has taken over the "bri-source" role — the nl-wallet
  # bri-mock has been removed from the stack.
  #
  # Public reachability: the wallet on a phone needs to reach
  # issuance-server (EUDI_PUBLIC_URL) and issuance-server needs to reach
  # eudi-adapter (EUDI_BRI_URL). Bring your own reachability — pick one:
  #
  #   (a) Own domain / reverse proxy: point two HTTPS hosts at the
  #       compose ports and set the two URLs in .env.
  #   (b) Cloudflare named tunnel (bundled): add
  #       `-f docker-compose.cloudflare-tunnel.yml` and set
  #       CLOUDFLARE_TUNNEL_TOKEN. The two URLs must still match the
  #       hostnames configured in your CF dashboard.
  #   (c) Ad-hoc / quick tunnel (ngrok, cloudflared --url, tailscale
  #       funnel, etc.): run it yourself, paste the two URLs into .env.
  #
  # Required env vars before `up`:
  #   NLWALLET_PATH     — path to the nl-wallet repo (for is-config mount)
  #   EUDI_PUBLIC_URL   — public HTTPS URL to issuance-server
  #   EUDI_BRI_URL      — public HTTPS URL to eudi-adapter
  # Missing var -> fail-loud on `up`.
  # ══════════════════════════════════════════════════════════════════════

  postgres-eudi:
    image: postgres:16-alpine
    profiles: [eudi, full]
    environment:
      POSTGRES_PASSWORD: ${EUDI_POSTGRES_PASSWORD}
      POSTGRES_USER: wallet
      POSTGRES_DB: issuance_server
    volumes:
      - postgres-eudi-data:/var/lib/postgresql/data
    networks: [eudi]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d issuance_server"]
      interval: 5s
      timeout: 3s
      retries: 10

  eudi-migrations:
    image: gbo/eudi-issuance-server:dev
    profiles: [eudi, full]
    entrypoint: ["/issuance_server_migrations"]
    command: ["up"]
    environment:
      DATABASE_URL: postgres://wallet:${EUDI_POSTGRES_PASSWORD}@postgres-eudi:5432/issuance_server
    depends_on:
      postgres-eudi:
        condition: service_healthy
    restart: "no"
    networks: [eudi]

  eudi-issuance-server:
    image: gbo/eudi-issuance-server:dev
    profiles: [eudi, full]
    # USER 0 in the scratch container so /tsl-publish is writable
    # (volume is root-owned by default). Fine for the demo; production
    # would use an init container `chown -R 1000` so USER 1000 stays.
    user: "0"
    ports:
      - "${GBO_PORT_EUDI_ISSUANCE:-18001}:18001"
    environment:
      - ISSUANCE_SERVER__STORAGE__URL=postgres://wallet:${EUDI_POSTGRES_PASSWORD}@postgres-eudi:5432/issuance_server
      # Concrete issuance products, endpoints and Type Metadata are generated
      # from every active source registration by `make eudi-config`.
      - ISSUANCE_SERVER__UNIVERSAL_LINK_BASE_URL=walletdebuginteraction://wallet.edi.rijksoverheid.nl/
      # Bind addresses explicitly — otherwise default localhost =
      # unreachable from other containers.
      - ISSUANCE_SERVER__WALLET_SERVER__IP=0.0.0.0
      - ISSUANCE_SERVER__WALLET_SERVER__PORT=18001
      - ISSUANCE_SERVER__INTERNAL_SERVER__IP=0.0.0.0
      - ISSUANCE_SERVER__INTERNAL_SERVER__PORT=18002
      # public_url: the issuance tunnel URL. The wallet QR embeds this
      # URL, so container-internal or localhost values do not work.
      # Fail-loud.
      - ISSUANCE_SERVER__PUBLIC_URL=${EUDI_PUBLIC_URL:?set EUDI_PUBLIC_URL to the eudi-tunnel URL before compose up}
    volumes:
      # Runtime config generated from the active onboarding records. The
      # source-specific certificate references remain in each activation;
      # this does not decide the still-open shared-vs-per-source cert model.
      #
      # issuance_server.toml is git-ignored because the generator inserts the
      # referenced signing keys. Run `make eudi-config` before starting the
      # EUDI profile.
      - ./services/eudi-issuance-server/config/issuance_server.toml:/issuance_server.toml:ro
      - ./services/eudi-issuance-server/config:/config:ro
      - eudi-tsl-publish:/tsl-publish
    depends_on:
      eudi-migrations:
        condition: service_completed_successfully
    networks: [eudi]

  # Optional: Cloudflare named tunnel wrapping the two EUDI-facing services
  # (issuance-server + eudi-adapter). Lives in docker-compose.cloudflare-tunnel.yml
  # (separate file, so the CLOUDFLARE_TUNNEL_TOKEN guard only evaluates when
  # you actually include it):
  #   docker compose -f docker-compose.yml -f docker-compose.cloudflare-tunnel.yml --profile eudi up
  # The two public hostnames must be configured in the Cloudflare dashboard
  # and passed as EUDI_PUBLIC_URL / EUDI_BRI_URL. If you already have a
  # reverse proxy, another tunnel, or your own domain, leave it out and just
  # set the two URLs directly.

  # EUDI adapter — translates the bri issuance contract to the generic
  # chain. The adapter talks to the real FSC-Outway (edi-outway).
  # Transport: eudi-adapter -> edi-outway (Fsc-Grant-Hash) -> mTLS ->
  # bd-inway -> backend.
  #
  # To reach edi-outway in the fsc-infra stack we join the external
  # fsc-infra_default network. FSC_GRANT_HASH via .env or shell-env;
  # contract created via UI (contract-seed automates this).
  eudi-adapter:
    build: ./services/eudi-adapter
    profiles: [eudi, full]
    ports:
      - "${GBO_PORT_EUDI_ADAPTER:-9409}:4009"
    environment:
      - OTEL_SERVICE_NAME=eudi-adapter
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - FSC_OUTWAY_URL=http://edi-outway:8080
      - ISSUER_OIN=99999999900000000100
      # Source metadata is activated from the single atomic onboarding record;
      # OIN, type and FSC services are not duplicated in env-vars.
      - SOURCE_ACTIVATIONS_PATH=/var/lib/gbo/active
      - TYPE_METADATA_PUBLIC_BASE_URL=${EUDI_BRI_URL:-}
      - TYPE_METADATA_STORE_PATH=/var/lib/gbo/type-metadata
    volumes:
      - ./.local/onboarding/active:/var/lib/gbo/active:ro
      - ./.local/onboarding/type-metadata:/var/lib/gbo/type-metadata
    networks:
      - eudi
      - backend
      - fsc-infra

  # Same image as the issuance runtime, but a separate one-shot process.
  # Kubernetes can run this command with --watch as a single-replica
  # Deployment, or without --watch as a CronJob.
  source-reconciler:
    build: ./services/eudi-adapter
    profiles: [onboarding]
    environment:
      - EUDI_PUBLIC_URL=${EUDI_PUBLIC_URL:-}
    command:
      - ./eudi-adapter
      - reconcile-fsc-sources
      - --manager-url=https://edi-manager:9443
      - --manager-ca=/fsc-certs/intermediate_ca.pem
      - --manager-cert=/fsc-certs/internal-cert.pem
      - --manager-key=/fsc-certs/internal-cert-key.pem
      - --consumer-oin=99999999900000000100
      - --outway-url=http://edi-outway:8080
      - --schema=/config/schemas/gbo-source-metadata-v1.schema.json
      - --type-metadata-base-url=${EUDI_BRI_URL:-http://localhost:9409}
      - --storage-backend=filesystem
      - --certificate-store=filesystem
      - --state-dir=/var/lib/gbo
      - --secrets-dir=/var/lib/gbo-secrets
      - --reader-public-url=${EUDI_PUBLIC_URL:-}
    volumes:
      - ./schemas:/config/schemas:ro
      - ./fsc-infra/orgs/edi-issuer/pki/internal:/fsc-certs:ro
      - ./.local/onboarding:/var/lib/gbo
      - ./.local/secrets:/var/lib/gbo-secrets
      - ./services/eudi-issuance-server/config:/generated
    networks:
      - fsc-infra

networks:
  frontend:
  backend:
  eudi:
  fsc-infra:
    # Which fsc-infra compose project to join. Defaults to the shared
    # single-tenant instance; a worktree running its own fsc-infra sets
    # FSC_INFRA_NETWORK=<that project>_default in .env.
    name: ${FSC_INFRA_NETWORK:-fsc-infra_default}
    external: true

volumes:
  dev-portal-var:
  postgres-eudi-data:
  postgres-ftv-data:
  eudi-tsl-publish:
